<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Token 生命环原型 · 俯视版</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;background:#2b2333;
    color:#eee;font:13px/1.55 system-ui,"Microsoft YaHei",sans-serif;
    display:flex;gap:28px;padding:28px;align-items:flex-start;flex-wrap:wrap;
    justify-content:center;
  }
  h1{font-size:17px;font-weight:600;margin:0 0 4px}
  h2{font-size:13px;font-weight:600;margin:16px 0 8px;color:#c9b6e0;
     border-bottom:1px solid #4a3363;padding-bottom:4px}
  .sub{color:#9a8fae;font-size:11.5px;margin:0 0 14px}

  /* ── 舞台：正俯视，和 Foundry 画布一样，没有任何 3D ── */
  .stage{position:relative;flex:0 0 auto;width:520px;height:520px;
         background:#3b3145;border:1px solid #55475f;overflow:hidden}
  .grid{position:absolute;inset:0}
  .ring{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;
        pointer-events:none}
  .ring path,.ring line{fill:none;stroke-linecap:butt;stroke-linejoin:miter}
  .track{stroke:rgba(255,255,255,.13)}
  .fill{stroke:#e03a3a;filter:drop-shadow(0 0 6px rgba(255,60,50,.55))}
  .thres{stroke:#fff;stroke-width:2;opacity:.85}
  .thres.done{stroke:#7a6b8c;opacity:.5}

  /* Token：正好一格，橙框（对应截图里那个黄框） */
  .token{position:absolute;transform:translate(-50%,-50%);
         border:3px solid #ff9a2e;border-radius:2px;
         background:linear-gradient(180deg,#5a6a9a,#252c48);
         display:grid;place-items:center;color:#cfd6ee;font-size:12px}

  /* ── HUD：屏幕空间，px 偏移＝ Foundry 里的 px 偏移 ── */
  .hud{position:absolute;inset:0;pointer-events:none}
  .hud > *{position:absolute;pointer-events:auto;cursor:grab;user-select:none;
           white-space:nowrap;transform:translate(-50%,-50%)}
  .hud > *.dragging{cursor:grabbing}
  .hud > *.sel{outline:1px dashed #9d7cc4;outline-offset:4px}
  .hp-val{font:700 30px/1 Impact,"Arial Black",sans-serif;color:#ff5a3c;
          text-shadow:0 2px 0 #000,0 0 10px rgba(255,60,40,.6)}
  .san-val{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
           font:700 17px/1 system-ui;color:#cfe4ff;
           background:rgba(12,20,40,.85);border:1px solid #5b7fbf;
           box-shadow:0 2px 8px rgba(0,0,0,.5);text-shadow:0 1px 2px #000}
  .buffs{display:flex;flex-wrap:wrap;justify-content:center}
  .buffs i{display:grid;place-items:center;font-style:normal;line-height:1;
           filter:drop-shadow(0 2px 3px rgba(0,0,0,.75))}

  /* ── 控制面板 ── */
  .panel{flex:1 1 330px;max-width:400px;background:rgba(20,12,32,.6);
         border:1px solid #4a3363;border-radius:10px;padding:16px 18px}
  .row{display:flex;align-items:center;gap:10px;margin:7px 0}
  .row label{flex:0 0 84px;color:#b9aec8}
  .row input[type=range]{flex:1;min-width:0}
  .row .num{flex:0 0 44px;text-align:right;font-variant-numeric:tabular-nums;color:#e8dcf5}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
  button{background:#2c1d3d;color:#eee;border:1px solid #6b4a8f;border-radius:6px;
         padding:6px 12px;cursor:pointer;font-size:12px}
  button:hover{background:#3d2a55}
  button.on{background:#6b4a8f;border-color:#c9a6f0}
  input[type=text]{background:#1b1128;color:#eee;border:1px solid #6b4a8f;
                   border-radius:5px;padding:5px 8px;font-size:12px;flex:1;min-width:0}
  pre{background:#0f0918;border:1px solid #3b2a52;border-radius:6px;padding:10px;
      font-size:11px;color:#b9d9c0;overflow:auto;max-height:220px;margin:8px 0 0}
  .hint{color:#8f82a3;font-size:11.5px;margin:6px 0 0}
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="grid" id="gridEl"></div>
  <svg class="ring" id="ringSvg">
    <path class="track" id="track"></path>
    <path class="fill"  id="fill"></path>
    <g id="thresGroup"></g>
  </svg>
  <div class="token" id="tokenEl">TOKEN</div>
  <div class="hud" id="hud">
    <div class="hp-val"  data-key="hp"   id="hpEl">278</div>
    <div class="san-val" data-key="san"  id="sanEl"><b>50</b></div>
    <div class="buffs"   data-key="buff" id="buffEl"></div>
  </div>
</div>

<div class="panel">
  <h1>Token 生命环 · 俯视原型</h1>
  <p class="sub">正俯视、无 3D —— 和 Foundry 画布一致。橙框 ＝ 1 格。
     所有数值都是「一格 100px 时的像素」，实装时按 grid.size/100 缩放。</p>

  <h2>格子</h2>
  <div class="row"><label>格子(px)</label><input type="range" id="cell" min="60" max="180" value="100"><span class="num" id="cellN">100</span></div>

  <h2>环形</h2>
  <div class="row"><label>边数</label><input type="range" id="sides" min="3" max="16" value="7"><span class="num" id="sidesN">7</span></div>
  <div class="row"><label>横向半径</label><input type="range" id="radiusX" min="20" max="220" value="83"><span class="num" id="radiusXN">83</span></div>
  <div class="row"><label>纵向半径</label><input type="range" id="radiusY" min="6"  max="220" value="31"><span class="num" id="radiusYN">31</span></div>
  <div class="row"><label>线粗(px)</label><input type="range" id="thick" min="2" max="40" value="12"><span class="num" id="thickN">12</span></div>
  <div class="btns">
    <button id="linkBtn">↔ 拉成正多边形</button>
    <span class="hint" style="align-self:center">两个半径相等 ＝ 不压扁</span>
  </div>
  <div class="row"><label>起点角</label><input type="range" id="start" min="0" max="359" value="193"><span class="num" id="startN">193</span></div>
  <div class="row"><label>血条起点</label><input type="range" id="arcStart" min="0" max="100" value="0"><span class="num" id="arcStartN">0</span></div>
  <div class="row"><label>血条终点</label><input type="range" id="arcEnd" min="0" max="100" value="50"><span class="num" id="arcEndN">50</span></div>
  <div class="btns">
    <button id="dirBtn" class="on">逆时针 ↺</button>
  </div>
  <p class="hint" id="scaleHint">—</p>

  <h2>混乱阈值</h2>
  <div class="row"><label>阈值(%)</label><input type="text" id="thresIn" value="60,30"></div>
  <div class="btns"><button id="thresToggle" class="on">显示刻度</button></div>

  <h2>数值</h2>
  <div class="row"><label>生命值</label><input type="range" id="hp" min="0" max="278" value="278"><span class="num" id="hpN">278</span></div>
  <div class="row"><label>理智值</label><input type="range" id="san" min="5" max="95" value="50"><span class="num" id="sanN">50</span></div>
  <div class="row"><label>BUFF 数</label><input type="range" id="buffCount" min="0" max="14" value="5"><span class="num" id="buffCountN">5</span></div>
  <div class="btns">
    <button data-dmg="20">-20</button><button data-dmg="60">-60</button>
    <button data-dmg="-40">+40</button><button id="reset">重置</button>
  </div>

  <h2>BUFF 行</h2>
  <div class="row"><label>图标(px)</label><input type="range" id="buffIcon" min="14" max="48" value="30"><span class="num" id="buffIconN">30</span></div>
  <div class="row"><label>间隔(px)</label><input type="range" id="buffGap" min="0" max="14" value="4"><span class="num" id="buffGapN">4</span></div>
  <div class="row"><label>每行个数</label><input type="range" id="buffPerRow" min="3" max="10" value="6"><span class="num" id="buffPerRowN">6</span></div>

  <h2>位置（可直接拖画面上的元素）</h2>
  <div class="btns" id="posPick">
    <button data-key="ring">环形</button>
    <button data-key="hp" class="on">生命值</button>
    <button data-key="san">理智值</button>
    <button data-key="buff">BUFF</button>
  </div>
  <div class="row"><label>X 偏移</label><input type="range" id="posX" min="-220" max="220" value="-81"><span class="num" id="posXN">-81</span></div>
  <div class="row"><label>Y 偏移</label><input type="range" id="posY" min="-220" max="220" value="-13"><span class="num" id="posYN">-13</span></div>

  <h2>导出配置</h2>
  <div class="btns"><button id="dump">生成 JSON</button></div>
  <pre id="out">—</pre>
</div>

<script>
/* 舞台中心 ＝ Token 中心 ＝ 所有偏移的原点 */
const SW = 520, CX = SW / 2, CY = SW / 2;

const cfg = {
  cell: 100,
  // 环是个椭圆多边形：横向、纵向半径分开给（都是 px）。
  // 两个相等就是正多边形；纵向小于横向就是"贴地"的那种扁环。
  sides: 7, radiusX: 83, radiusY: 31, thickness: 12,
  startDeg: 193, ccw: true,
  arcStart: 0, arcEnd: 50,
  thresholds: [60, 30], showThres: true,
  buffIcon: 30, buffGap: 4, buffPerRow: 6,
  pos: { ring:{x:0,y:0}, hp:{x:-81,y:-13}, san:{x:77,y:-11}, buff:{x:1,y:88} },
  hp: 278, hpMax: 278, san: 50,
  buffCount: 5
};
const EMOJI = ["🔥","🛡","⚡","💧","🌀","🩸","❄","☠","🌟","🍀","🕯","🔮","⚙","🎴"];
let posKey = "hp";

const $ = id => document.getElementById(id);
const fillEl = $("fill"), trackEl = $("track"), thresG = $("thresGroup");

/* ── 几何：多边形顶点（已压扁），单位就是屏幕 px ── */
function polygonPts(){
  const a0 = cfg.startDeg * Math.PI / 180;
  const step = (2*Math.PI/cfg.sides) * (cfg.ccw ? -1 : 1);
  const ox = CX + cfg.pos.ring.x, oy = CY + cfg.pos.ring.y;   // 环自己的偏移
  const pts = [];
  for (let i = 0; i < cfg.sides; i++){
    const a = a0 + i*step;
    pts.push({ x: ox + cfg.radiusX*Math.cos(a), y: oy + cfg.radiusY*Math.sin(a) });
  }
  pts.push({ ...pts[0] });
  return pts;
}
function measure(pts){
  const segs = []; let total = 0;
  for (let i = 0; i < pts.length-1; i++){
    const d = Math.hypot(pts[i+1].x-pts[i].x, pts[i+1].y-pts[i].y);
    segs.push(d); total += d;
  }
  return { segs, total };
}
function at(pts, segs, dist){
  let d = Math.max(0, dist);
  for (let i = 0; i < segs.length; i++){
    if (d <= segs[i] || i === segs.length-1){
      const t = segs[i] ? Math.min(1, d/segs[i]) : 0;
      const p0 = pts[i], p1 = pts[i+1];
      const dx = p1.x-p0.x, dy = p1.y-p0.y, m = Math.hypot(dx,dy) || 1;
      return { x: p0.x+dx*t, y: p0.y+dy*t, tx: dx/m, ty: dy/m };
    }
    d -= segs[i];
  }
  const l = pts[pts.length-1];
  return { x:l.x, y:l.y, tx:1, ty:0 };
}
/* 折线上 [d0,d1] 这一段 → SVG path */
function slicePath(pts, segs, d0, d1){
  if (!(d1 > d0)) return "";
  const out = [at(pts, segs, d0)];
  let acc = 0;
  for (let i = 0; i < segs.length; i++){
    const end = acc + segs[i];
    if (end > d0 && end < d1) out.push(pts[i+1]);
    acc = end;
  }
  out.push(at(pts, segs, d1));
  return "M" + out.map(p => `${p.x.toFixed(2)},${p.y.toFixed(2)}`).join("L");
}

/* ── 渲染 ── */
function drawGrid(){
  const c = cfg.cell;
  const ox = ((CX - c/2) % c + c) % c, oy = ((CY - c/2) % c + c) % c;
  const g = $("gridEl");
  g.style.background =
    `repeating-linear-gradient(90deg, rgba(255,255,255,.10) 0 1px, transparent 1px ${c}px),`
  + `repeating-linear-gradient(0deg,  rgba(255,255,255,.10) 0 1px, transparent 1px ${c}px)`;
  g.style.backgroundPosition = `${ox}px ${oy}px`;
  const t = $("tokenEl");
  t.style.width = c + "px"; t.style.height = c + "px";
  t.style.left = CX + "px"; t.style.top = CY + "px";
}

function render(){
  const pts = polygonPts();
  const { segs, total } = measure(pts);
  const a = total * Math.min(cfg.arcStart, cfg.arcEnd) / 100;
  const b = total * Math.max(cfg.arcStart, cfg.arcEnd) / 100;
  const S = b - a;
  const pct = Math.max(0, Math.min(1, cfg.hp / cfg.hpMax));

  trackEl.setAttribute("d", slicePath(pts, segs, a, b));
  fillEl.setAttribute("d",  pct > 0 ? slicePath(pts, segs, a + S*(1-pct), b) : "");
  trackEl.style.strokeWidth = cfg.thickness;
  fillEl.style.strokeWidth  = cfg.thickness;
  fillEl.style.stroke = pct <= .3 ? "#ff2d2d" : "#e03a3a";

  thresG.innerHTML = "";
  if (cfg.showThres){
    const half = cfg.thickness/2 + 4;
    for (const p0 of cfg.thresholds){
      const p = at(pts, segs, a + S*(1 - p0/100));
      const nx = -p.ty, ny = p.tx;
      const el = document.createElementNS("http://www.w3.org/2000/svg","line");
      el.setAttribute("x1", p.x-nx*half); el.setAttribute("y1", p.y-ny*half);
      el.setAttribute("x2", p.x+nx*half); el.setAttribute("y2", p.y+ny*half);
      el.setAttribute("class","thres" + (pct <= p0/100 ? " done" : ""));
      thresG.appendChild(el);
    }
  }

  $("hpEl").textContent = Math.round(cfg.hp);
  $("sanEl").querySelector("b").textContent = Math.round(cfg.san);

  const bw = cfg.buffPerRow * cfg.buffIcon + (cfg.buffPerRow-1) * cfg.buffGap;
  const be = $("buffEl");
  be.style.width = bw + "px";
  be.style.gap = cfg.buffGap + "px";
  be.innerHTML = Array.from({length: cfg.buffCount}, (_,i) =>
    `<i style="width:${cfg.buffIcon}px;height:${cfg.buffIcon}px;font-size:${Math.round(cfg.buffIcon*.8)}px">${EMOJI[i%EMOJI.length]}</i>`).join("");

  document.querySelectorAll("#hud > *").forEach(el => {
    const p = cfg.pos[el.dataset.key];
    if (!p) return;
    el.style.left = (CX + p.x) + "px";
    el.style.top  = (CY + p.y) + "px";
  });

  const w = cfg.radiusX * 2, h = cfg.radiusY * 2;
  $("scaleHint").textContent =
    `环宽 ${w}px ＝ ${(w/cfg.cell).toFixed(2)} 格　·　环高 ${h}px ＝ ${(h/cfg.cell).toFixed(2)} 格`;
}

/* ── 控件 ── */
function slider(id, key, after){
  const el = $(id), n = $(id + "N");
  el.oninput = () => { const v = +el.value; if (n) n.textContent = v; key(v); (after||render)(); };
}
slider("cell",       v => cfg.cell = v,       () => { drawGrid(); render(); });
slider("sides",      v => cfg.sides = v);
slider("radiusX",    v => cfg.radiusX = v);
slider("radiusY",    v => cfg.radiusY = v);
slider("thick",      v => cfg.thickness = v);
slider("start",      v => cfg.startDeg = v);
slider("arcStart",   v => cfg.arcStart = v);
slider("arcEnd",     v => cfg.arcEnd = v);
slider("hp",         v => cfg.hp = v);
slider("san",        v => cfg.san = v);
slider("buffCount",  v => cfg.buffCount = v);
slider("buffIcon",   v => cfg.buffIcon = v);
slider("buffGap",    v => cfg.buffGap = v);
slider("buffPerRow", v => cfg.buffPerRow = v);
slider("posX",       v => cfg.pos[posKey].x = v);
slider("posY",       v => cfg.pos[posKey].y = v);

$("linkBtn").onclick = () => {
  cfg.radiusY = cfg.radiusX;
  $("radiusY").value = cfg.radiusY; $("radiusYN").textContent = cfg.radiusY;
  render();
};
$("dirBtn").onclick = e => {
  cfg.ccw = !cfg.ccw;
  e.target.textContent = cfg.ccw ? "逆时针 ↺" : "顺时针 ↻";
  e.target.classList.toggle("on", cfg.ccw);
  render();
};
$("thresIn").oninput = e => {
  cfg.thresholds = e.target.value.split(",").map(s => parseFloat(s)).filter(v => v > 0 && v <= 100);
  render();
};
$("thresToggle").onclick = e => {
  cfg.showThres = !cfg.showThres;
  e.target.classList.toggle("on", cfg.showThres);
  render();
};
document.querySelectorAll("[data-dmg]").forEach(b => b.onclick = () => {
  cfg.hp = Math.max(0, Math.min(cfg.hpMax, cfg.hp - +b.dataset.dmg));
  $("hp").value = cfg.hp; $("hpN").textContent = cfg.hp; render();
});
$("reset").onclick = () => { cfg.hp = cfg.hpMax; $("hp").value = cfg.hp; $("hpN").textContent = cfg.hp; render(); };

function selectKey(k){
  posKey = k;
  document.querySelectorAll("#posPick button").forEach(b => b.classList.toggle("on", b.dataset.key === k));
  document.querySelectorAll("#hud > *").forEach(e => e.classList.toggle("sel", e.dataset.key === k));
  $("ringSvg").style.filter = (k === "ring") ? "drop-shadow(0 0 4px #c9a6f0)" : "";
  $("posX").value = cfg.pos[k].x; $("posXN").textContent = cfg.pos[k].x;
  $("posY").value = cfg.pos[k].y; $("posYN").textContent = cfg.pos[k].y;
}
document.querySelectorAll("#posPick button").forEach(b => b.onclick = () => selectKey(b.dataset.key));

let drag = null;
$("hud").addEventListener("pointerdown", ev => {
  const el = ev.target.closest("#hud > *");
  if (!el) return;
  const k = el.dataset.key; selectKey(k);
  drag = { el, k, sx: ev.clientX, sy: ev.clientY, ox: cfg.pos[k].x, oy: cfg.pos[k].y };
  el.classList.add("dragging"); el.setPointerCapture(ev.pointerId);
});
addEventListener("pointermove", ev => {
  if (!drag) return;
  cfg.pos[drag.k].x = Math.round(drag.ox + ev.clientX - drag.sx);
  cfg.pos[drag.k].y = Math.round(drag.oy + ev.clientY - drag.sy);
  $("posX").value = cfg.pos[drag.k].x; $("posXN").textContent = cfg.pos[drag.k].x;
  $("posY").value = cfg.pos[drag.k].y; $("posYN").textContent = cfg.pos[drag.k].y;
  render();
});
addEventListener("pointerup", () => { if (drag) drag.el.classList.remove("dragging"); drag = null; });

$("dump").onclick = () => {
  const { sides, radiusX, radiusY, thickness, startDeg, ccw, arcStart, arcEnd,
          thresholds, showThres, buffIcon, buffGap, buffPerRow, pos } = cfg;
  $("out").textContent = JSON.stringify(
    { sides, radiusX, radiusY, thickness, startDeg, ccw, arcStart, arcEnd,
      thresholds, showThres, buffIcon, buffGap, buffPerRow, pos }, null, 2);
};

selectKey("hp");
drawGrid();
render();
</script>
</body>
</html>
