<!doctype html>
<meta charset="utf-8">
<title>回合开始横幅·素材版调参</title>
<style>
:root{
  --font-main:"Noto Sans SC","Microsoft YaHei",sans-serif;

  /* ── 黑条 ── */
  --band-h:121; --band-y:40; --band-col:#070605; --band-a:83;

  /* ── 钟表素材 ── */
  --clock-w:150; --clock-x:0; --clock-y:0; --clock-from:340; --clock-a:100;

  /* ── 红线素材（上下各一条） ── */
  --line-w:70;      /* 宽度：占屏宽 %（上下两条在同一张图里） */
  --line-x:0;       /* 水平微调 px */
  --line-y:0;       /* 垂直微调 px */
  --line-a:100;     /* 不透明度 % */

  /* ── TURN 素材 ── */
  --word-w:180; --word-x:0; --word-y:0; --word-a:100;

  /* ── 回合数（文字） ── */
  --num-size:52; --num-col:#DC4110; --num-gap:20; --num-dx:0; --num-dy:0; --num-glow:55;

  /* ── 时间轴 ── */
  --t-band:60; --t-clock:160; --t-swing:60; --t-text:260;
  --swing-deg:15; --t-hold:0; --t-out:260;
}
body{margin:0;background:#141110;color:#E8CAA2;font-family:var(--font-main);
  display:flex;gap:18px;align-items:flex-start;padding:16px;flex-wrap:wrap;}
h1{font-size:16px;margin:0 0 3px;letter-spacing:.06em;}
p.sub{margin:0 0 10px;font-size:12px;color:#6E5540;max-width:600px;line-height:1.7;}
h2{font-size:11.5px;color:#E7B956;margin:9px 0 1px;letter-spacing:.1em;font-weight:normal;}

/* ══ 舞台 ══ */
.stage{position:relative;width:680px;height:430px;overflow:hidden;border-radius:5px;
  border:1px solid #2b2119;
  background:repeating-linear-gradient(0deg,#1b1714 0 39px,#221c18 39px 40px),
             repeating-linear-gradient(90deg,#1b1714 0 39px,#221c18 39px 40px);}
.stage .fake-token{position:absolute;width:44px;height:44px;border-radius:50%;
  background:#3B2412;border:2px solid #5F3E22;}

/* ══ 横幅 ══ */
.lc-turn-banner{position:absolute;left:0;right:0;top:calc(var(--band-y)*1%);
  height:calc(var(--band-h)*1px);transform:translateY(-50%);
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;overflow:visible;opacity:0;}
.lc-turn-banner.show{opacity:1;}

.lc-tb-band{position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,
    color-mix(in srgb,var(--band-col) calc(var(--band-a)*1%),transparent) 8%,
    color-mix(in srgb,var(--band-col) calc(var(--band-a)*1%),transparent) 92%,transparent);
  transform:scaleY(0);transform-origin:center;}

.lc-tb-clock{position:absolute;left:50%;top:50%;z-index:1;opacity:0;
  width:calc(var(--clock-w)*1px);
  transform:translate(-50%,-50%) translate(calc(var(--clock-x)*1px),calc(var(--clock-y)*1px));
  transform-origin:center;}
.lc-tb-clock img{width:100%;height:auto;display:block;opacity:calc(var(--clock-a)/100);
  filter:drop-shadow(0 0 8px rgba(0,0,0,.8));}

.lc-tb-line{position:absolute;left:50%;top:50%;width:calc(var(--line-w)*1%);z-index:2;
  transform:translate(-50%,-50%) translate(calc(var(--line-x)*1px),calc(var(--line-y)*1px)) scaleX(0);
  transform-origin:center;}
.lc-tb-line img{width:100%;height:auto;display:block;opacity:calc(var(--line-a)/100);}

.lc-tb-text{position:absolute;left:0;right:0;top:50%;z-index:3;opacity:0;
  transform:translateY(-50%);
  display:flex;align-items:center;justify-content:center;gap:calc(var(--num-gap)*1px);}
.lc-tb-word{width:calc(var(--word-w)*1px);flex-shrink:0;
  transform:translate(calc(var(--word-x)*1px),calc(var(--word-y)*1px));}
.lc-tb-word img{width:100%;height:auto;display:block;opacity:calc(var(--word-a)/100);
  filter:drop-shadow(0 2px 10px rgba(0,0,0,.9));}
.lc-tb-num{font-size:calc(var(--num-size)*1px);font-weight:bold;color:var(--num-col);
  line-height:1;font-variant-numeric:tabular-nums;
  transform:translate(calc(var(--num-dx)*1px),calc(var(--num-dy)*1px));
  text-shadow:0 0 calc(var(--num-glow)/4*1px) color-mix(in srgb,var(--num-col) calc(var(--num-glow)*1%),transparent),
              0 2px 10px rgba(0,0,0,.9);}

/* 素材没上传时的占位 */
.ph{display:flex;align-items:center;justify-content:center;
  border:1px dashed #5F3E22;color:#6E5540;font-size:12px;background:rgba(0,0,0,.35);}
.lc-tb-clock .ph{aspect-ratio:1/1;border-radius:50%;}
.lc-tb-line  .ph{height:74px;}
.lc-tb-word  .ph{height:52px;}

/* ── 播放 ── */
.play .lc-tb-band {animation:tb-band calc(var(--t-band)*1ms) cubic-bezier(.2,.9,.3,1) forwards,
  tb-out calc(var(--t-out)*1ms) ease-in var(--d-out) forwards;}
.play .lc-tb-clock{animation:
  tb-clock-in calc(var(--t-clock)*1ms) cubic-bezier(.14,.8,.28,1) var(--d-clock) both,
  tb-swing    calc(var(--t-swing)*1ms) cubic-bezier(.36,.07,.19,.97) var(--d-swing) both,
  tb-out      calc(var(--t-out)*1ms) ease-in var(--d-out) forwards;}
.play .lc-tb-line {animation:tb-line calc(var(--t-text)*1ms) cubic-bezier(.16,.84,.3,1) var(--d-text) both,
  tb-out calc(var(--t-out)*1ms) ease-in var(--d-out) forwards;}
.play .lc-tb-text {animation:tb-text calc(var(--t-text)*1ms) cubic-bezier(.16,.84,.3,1) var(--d-text) both,
  tb-out calc(var(--t-out)*1ms) ease-in var(--d-out) forwards;}

@keyframes tb-band{from{transform:scaleY(0);}to{transform:scaleY(1);}}
@keyframes tb-clock-in{
  from{opacity:0;transform:translate(-50%,-50%) translate(calc(var(--clock-x)*1px),calc(var(--clock-y)*1px)) scale(calc(var(--clock-from)/100));}
  to  {opacity:1;transform:translate(-50%,-50%) translate(calc(var(--clock-x)*1px),calc(var(--clock-y)*1px)) scale(1);}}
@keyframes tb-swing{
  0%  {transform:translate(-50%,-50%) translate(calc(var(--clock-x)*1px),calc(var(--clock-y)*1px)) rotate(0deg);}
  35% {transform:translate(-50%,-50%) translate(calc(var(--clock-x)*1px),calc(var(--clock-y)*1px)) rotate(calc(var(--swing-deg)*-1deg));}
  70% {transform:translate(-50%,-50%) translate(calc(var(--clock-x)*1px),calc(var(--clock-y)*1px)) rotate(calc(var(--swing-deg)*0.35deg));}
  100%{transform:translate(-50%,-50%) translate(calc(var(--clock-x)*1px),calc(var(--clock-y)*1px)) rotate(0deg);}}
@keyframes tb-line{
  from{transform:translate(-50%,-50%) translate(calc(var(--line-x)*1px),calc(var(--line-y)*1px)) scaleX(0);}
  to  {transform:translate(-50%,-50%) translate(calc(var(--line-x)*1px),calc(var(--line-y)*1px)) scaleX(1);}}
@keyframes tb-text{
  from{opacity:0;transform:translateY(-50%) scale(.86);}
  to  {opacity:1;transform:translateY(-50%) scale(1);}}
@keyframes tb-out{from{opacity:1;}to{opacity:0;}}

/* ══ 面板 ══ */
.panel{border:1px solid #2b2119;border-radius:4px;padding:12px 14px;width:420px;
  display:flex;flex-direction:column;gap:5px;max-height:94vh;overflow:auto;}
.btnrow{display:flex;gap:6px;margin-bottom:2px;flex-wrap:wrap;}
.btn{font-size:12px;padding:4px 12px;border-radius:3px;cursor:pointer;
  border:1px solid #3A2A1C;background:#15110E;color:#9B6839;}
.btn:hover{color:#E7B956;border-color:#E7B956;}
.btn.primary{background:#E7B956;border-color:#E7B956;color:#15110E;font-weight:bold;}
.up{display:flex;align-items:center;gap:6px;font-size:12px;padding:4px 0;}
.up label{width:62px;color:#9B6839;}
.up input[type=text]{flex:1;min-width:0;background:#15110E;border:1px solid #3A2A1C;
  border-radius:2px;color:#E8CAA2;font:11px monospace;padding:3px 5px;}
.up input[type=file]{width:96px;font-size:10px;color:#6E5540;}
.row{display:flex;align-items:center;gap:8px;font-size:12px;}
.row label{width:110px;color:#9B6839;}
.row input[type=range]{flex:1;min-width:70px;}
.row input[type=color]{width:38px;height:22px;padding:0;border:1px solid #3A2A1C;background:none;}
.row b{width:46px;text-align:right;color:#E7B956;font:11.5px monospace;}
textarea{width:100%;height:200px;background:#15110E;border:1px solid #3A2A1C;border-radius:3px;
  color:#E8CAA2;font:11px/1.5 monospace;padding:7px;resize:vertical;margin-top:6px;}
.note{font-size:11.5px;color:#6E5540;line-height:1.7;}
.tl{font:11px/1.6 monospace;color:#8A6E52;background:#15110E;border:1px solid #3A2A1C;
  border-radius:3px;padding:6px 8px;}
</style>

<div>
  <h1>回合开始横幅·素材版调参</h1>
  <p class="sub">三个素材：<b>钟</b>、<b>红线</b>（上下两条在同一张图里）、<b>TURN</b>。
    在右边选本地文件即可**立刻预览**（只在本页临时用，不上传）；
    旁边的路径框写的是**实装时的真实路径**，会写进导出的 CSS。回合数仍是文字（好换数字）。</p>
  <div class="stage" id="stage">
    <div class="fake-token" style="left:120px;top:310px"></div>
    <div class="fake-token" style="left:480px;top:120px"></div>

    <div class="lc-turn-banner" id="banner">
      <div class="lc-tb-band"></div>
      <div class="lc-tb-line" id="lineBox"><div class="ph">红线素材（上下两条在同一张图里）</div></div>
      <div class="lc-tb-clock" id="clockBox"><div class="ph">钟表素材</div></div>
      <div class="lc-tb-text">
        <div class="lc-tb-word" id="wordBox"><div class="ph">TURN 素材</div></div>
        <span class="lc-tb-num" id="num">3</span>
      </div>
    </div>
  </div>
</div>

<div class="panel">
  <div class="btnrow">
    <span class="btn primary" id="play">▶ 播放</span>
    <span class="btn" id="hold">常显（调版面）</span>
    <span class="btn" id="rnd">回合数 +1</span>
  </div>

  <h2>素材</h2>
  <div class="up"><label>钟</label>
    <input type="file" accept="image/*" id="f-clock">
    <input type="text" id="p-clock" value="assets/icons/GUI/turn_clock.webp"></div>
  <div class="up"><label>红线</label>
    <input type="file" accept="image/*" id="f-line">
    <input type="text" id="p-line" value="assets/icons/GUI/turn_line.webp"></div>
  <div class="up"><label>TURN</label>
    <input type="file" accept="image/*" id="f-word">
    <input type="text" id="p-word" value="assets/icons/GUI/turn_word.webp"></div>

  <div class="tl" id="timeline"></div>
  <div id="ctrls"></div>
  <textarea id="out" readonly></textarea>
  <div class="note">导出的 CSS 里图片路径会自动补上 <code>systems/limbusCompany_FVTT/</code> 前缀。</div>
</div>

<script>
const $ = id => document.getElementById(id);

const P = [
  ["H0","","h",0,"黑条"],
  ["band-h","--band-h","n",121,"高度"],
  ["band-y","--band-y","n",40,"纵向位置%"],
  ["band-col","--band-col","c","#070605","颜色"],
  ["band-a","--band-a","n",83,"不透明度%"],
  ["H1","","h",0,"钟表素材"],
  ["clock-w","--clock-w","n",150,"宽度"],
  ["clock-x","--clock-x","n",0,"水平微调"],
  ["clock-y","--clock-y","n",0,"垂直微调"],
  ["clock-a","--clock-a","n",100,"不透明度%"],
  ["clock-from","--clock-from","n",340,"入场放大%"],
  ["swing-deg","--swing-deg","n",15,"逆时针角度"],
  ["H2","","h",0,"红线素材"],
  ["line-w","--line-w","n",70,"宽度%"],
  ["line-x","--line-x","n",0,"水平微调"],
  ["line-y","--line-y","n",0,"垂直微调"],
  ["line-a","--line-a","n",100,"不透明度%"],
  ["H3","","h",0,"TURN 素材"],
  ["word-w","--word-w","n",180,"宽度"],
  ["word-x","--word-x","n",0,"水平微调"],
  ["word-y","--word-y","n",0,"垂直微调"],
  ["word-a","--word-a","n",100,"不透明度%"],
  ["H4","","h",0,"回合数（文字）"],
  ["num-size","--num-size","n",52,"字号"],
  ["num-col","--num-col","c","#DC4110","颜色"],
  ["num-gap","--num-gap","n",20,"与 TURN 间距"],
  ["num-dx","--num-dx","n",0,"水平微调"],
  ["num-dy","--num-dy","n",0,"垂直微调"],
  ["num-glow","--num-glow","n",55,"光晕%"],
  ["H5","","h",0,"时间轴"],
  ["t-band","--t-band","n",60,"黑条 ms"],
  ["t-clock","--t-clock","n",160,"钟缩入 ms"],
  ["t-swing","--t-swing","n",60,"摆动 ms"],
  ["t-text","--t-text","n",260,"线+字 ms"],
  ["t-hold","--t-hold","n",0,"停留 ms"],
  ["t-out","--t-out","n",260,"退出 ms"],
];
const RANGE = {
  "band-h":[60,300],"band-y":[10,90],"band-a":[0,100],
  "clock-w":[40,400],"clock-x":[-300,300],"clock-y":[-150,150],"clock-a":[0,100],
  "clock-from":[100,800],"swing-deg":[0,45],
  "line-w":[20,140],"line-x":[-200,200],"line-y":[-150,150],"line-a":[0,100],
  "word-w":[40,500],"word-x":[-300,300],"word-y":[-150,150],"word-a":[0,100],
  "num-size":[16,140],"num-gap":[0,120],"num-dx":[-200,200],"num-dy":[-100,100],"num-glow":[0,100],
  "t-band":[20,400],"t-clock":[40,600],"t-swing":[20,400],"t-text":[40,600],
  "t-hold":[0,1500],"t-out":[40,600],
};
$("ctrls").innerHTML = P.map(([id,,t,def,zh]) => {
  if (t === "h") return `<h2>${zh}</h2>`;
  if (t === "c") return `<div class="row"><label>${zh}</label>
    <input type="color" id="${id}" value="${def}"><b id="${id}-n"></b></div>`;
  const [mn,mx] = RANGE[id] || [0,100];
  const step = id.startsWith("t-") ? 10 : 1;
  return `<div class="row"><label>${zh}</label>
    <input type="range" id="${id}" min="${mn}" max="${mx}" step="${step}" value="${def}"><b id="${id}-n"></b></div>`;
}).join("");

/* ── 素材上传：本地预览 ── */
const SLOTS = {
  clock: { file: "f-clock", path: "p-clock", boxes: ["clockBox"] },
  line:  { file: "f-line",  path: "p-line",  boxes: ["lineBox"] },
  word:  { file: "f-word",  path: "p-word",  boxes: ["wordBox"] },
};
for (const [key, s] of Object.entries(SLOTS)) {
  $(s.file).addEventListener("change", (ev) => {
    const f = ev.target.files?.[0];
    if (!f) return;
    const url = URL.createObjectURL(f);
    for (const b of s.boxes) {
      $(b).innerHTML = `<img src="${url}" alt="">`;
    }
    apply();
  });
  $(s.path).addEventListener("input", dump);
}

const V = id => $(id).value, N = id => Number($(id).value);
function rgba(hex,a){const n=parseInt(hex.replace("#",""),16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${(+a).toFixed(2)})`;}
function assetPath(id){
  let p = V(id).trim().replace(/^\/+/, "");
  if (!p.startsWith("systems/")) p = `systems/limbusCompany_FVTT/${p}`;
  return p;
}
function times(){
  const band=N("t-band"), clock=N("t-clock"), swing=N("t-swing"),
        text=N("t-text"), hold=N("t-hold"), out=N("t-out");
  const dClock = band, dSwing = dClock + clock,
        dText  = dSwing + swing * 0.55, dOut = dText + text + hold;
  return { band, clock, swing, text, hold, out, dClock, dSwing,
           dText: Math.round(dText), dOut: Math.round(dOut),
           total: Math.round(dOut + out) };
}
function apply(){
  const rs = document.documentElement.style;
  for (const [id,v,t] of P){
    if (t === "h") continue;
    if (t === "c"){ rs.setProperty(v, V(id)); $(id+"-n").textContent = V(id); }
    else { rs.setProperty(v, N(id)); $(id+"-n").textContent = N(id); }
  }
  const T = times();
  rs.setProperty("--d-clock", `${T.dClock}ms`);
  rs.setProperty("--d-swing", `${T.dSwing}ms`);
  rs.setProperty("--d-text",  `${T.dText}ms`);
  rs.setProperty("--d-out",   `${T.dOut}ms`);
  $("timeline").innerHTML =
    `0ms 黑条 → ${T.dClock}ms 钟缩入 → ${T.dSwing}ms 摆动 → ${T.dText}ms 线+TURN → ${T.dOut}ms 淡出` +
    `<br><span style="color:${T.total > 900 ? "#E2705C" : "#7FB57F"}">总时长 ${T.total}ms</span>`;
  dump();
}
let round = 3, holding = false;
function play(){
  const b = $("banner");
  b.classList.remove("play","show"); void b.offsetWidth;
  b.classList.add("play","show");
  clearTimeout(play._t);
  play._t = setTimeout(() => b.classList.remove("play","show"), times().total + 80);
}
$("play").addEventListener("click", () => { holding = false; play(); });
$("hold").addEventListener("click", () => {
  holding = !holding;
  const b = $("banner");
  b.classList.remove("play");
  b.classList.toggle("show", holding);
  b.querySelectorAll(".lc-tb-band,.lc-tb-line,.lc-tb-clock,.lc-tb-text").forEach(el => {
    el.style.opacity = holding ? "1" : "";
    if (!holding) { el.style.transform = ""; return; }
    if (el.classList.contains("lc-tb-line"))
      el.style.transform = "translate(-50%,-50%) translate(calc(var(--line-x)*1px),calc(var(--line-y)*1px)) scaleX(1)";
    else if (el.classList.contains("lc-tb-clock"))
      el.style.transform = "translate(-50%,-50%) translate(calc(var(--clock-x)*1px),calc(var(--clock-y)*1px)) scale(1)";
    else if (el.classList.contains("lc-tb-text"))
      el.style.transform = "translateY(-50%)";
    else el.style.transform = "scaleY(1)";
  });
});
$("rnd").addEventListener("click", () => { round++; $("num").textContent = round; play(); });

function dump(){
  const T = times();
  $("out").value =
`/* ══ 回合开始横幅（素材版：钟 / 红线×2 / TURN + 回合数）══ */
.lc-turn-banner {
  position: fixed; left: 0; right: 0; top: ${N("band-y")}%;
  height: ${N("band-h")}px; transform: translateY(-50%);
  display: flex; align-items: center; justify-content: center;
  pointer-events: none; z-index: 100; opacity: 0;
}
.lc-turn-banner.show { opacity: 1; }

/* ① 黑条 */
.lc-turn-banner .lc-tb-band {
  position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent,
    ${rgba(V("band-col"), N("band-a")/100)} 8%,
    ${rgba(V("band-col"), N("band-a")/100)} 92%, transparent);
  transform: scaleY(0); transform-origin: center;
}
/* ② 钟 */
.lc-turn-banner .lc-tb-clock {
  position: absolute; left: 50%; top: 50%; z-index: 1; opacity: 0;
  width: ${N("clock-w")}px;
  transform: translate(-50%, -50%) translate(${N("clock-x")}px, ${N("clock-y")}px);
  transform-origin: center;
  background: url("${assetPath("p-clock")}") center/contain no-repeat;
  aspect-ratio: 1 / 1;
  filter: drop-shadow(0 0 8px rgba(0,0,0,.8));
  opacity: 0;
}
/* ④ 红线（上下两条在同一张图里，整张缩放定位） */
.lc-turn-banner .lc-tb-line {
  position: absolute; left: 50%; top: 50%; width: ${N("line-w")}%; z-index: 2;
  transform: translate(-50%, -50%) translate(${N("line-x")}px, ${N("line-y")}px) scaleX(0);
  transform-origin: center;
  opacity: ${(N("line-a")/100).toFixed(2)};
}
.lc-turn-banner .lc-tb-line img { width: 100%; height: auto; display: block; }
/* ④ TURN + 回合数 */
.lc-turn-banner .lc-tb-text {
  position: absolute; left: 0; right: 0; top: 50%; z-index: 3; opacity: 0;
  transform: translateY(-50%);
  display: flex; align-items: center; justify-content: center; gap: ${N("num-gap")}px;
}
.lc-turn-banner .lc-tb-word {
  width: ${N("word-w")}px; flex-shrink: 0;
  transform: translate(${N("word-x")}px, ${N("word-y")}px);
}
.lc-turn-banner .lc-tb-word img {
  width: 100%; height: auto; display: block;
  opacity: ${(N("word-a")/100).toFixed(2)};
  filter: drop-shadow(0 2px 10px rgba(0,0,0,.9));
}
.lc-turn-banner .lc-tb-num {
  font-size: ${N("num-size")}px; font-weight: bold; color: ${V("num-col")};
  line-height: 1; font-variant-numeric: tabular-nums;
  transform: translate(${N("num-dx")}px, ${N("num-dy")}px);
  text-shadow: 0 0 ${(N("num-glow")/4).toFixed(1)}px ${rgba(V("num-col"), N("num-glow")/100)},
               0 2px 10px rgba(0,0,0,.9);
}

/* ── 播放 ── */
.lc-turn-banner.play .lc-tb-band {
  animation: lc-tb-band ${T.band}ms cubic-bezier(.2,.9,.3,1) forwards,
             lc-tb-out ${T.out}ms ease-in ${T.dOut}ms forwards;
}
.lc-turn-banner.play .lc-tb-clock {
  animation: lc-tb-clock-in ${T.clock}ms cubic-bezier(.14,.8,.28,1) ${T.dClock}ms both,
             lc-tb-swing ${T.swing}ms cubic-bezier(.36,.07,.19,.97) ${T.dSwing}ms both,
             lc-tb-out ${T.out}ms ease-in ${T.dOut}ms forwards;
}
.lc-turn-banner.play .lc-tb-line {
  animation: lc-tb-line ${T.text}ms cubic-bezier(.16,.84,.3,1) ${T.dText}ms both,
             lc-tb-out ${T.out}ms ease-in ${T.dOut}ms forwards;
}
.lc-turn-banner.play .lc-tb-text {
  animation: lc-tb-text ${T.text}ms cubic-bezier(.16,.84,.3,1) ${T.dText}ms both,
             lc-tb-out ${T.out}ms ease-in ${T.dOut}ms forwards;
}

@keyframes lc-tb-band { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes lc-tb-clock-in {
  from { opacity: 0;
         transform: translate(-50%,-50%) translate(${N("clock-x")}px, ${N("clock-y")}px) scale(${(N("clock-from")/100).toFixed(2)}); }
  to   { opacity: ${(N("clock-a")/100).toFixed(2)};
         transform: translate(-50%,-50%) translate(${N("clock-x")}px, ${N("clock-y")}px) scale(1); }
}
@keyframes lc-tb-swing {
  0%   { transform: translate(-50%,-50%) translate(${N("clock-x")}px, ${N("clock-y")}px) rotate(0deg); }
  35%  { transform: translate(-50%,-50%) translate(${N("clock-x")}px, ${N("clock-y")}px) rotate(-${N("swing-deg")}deg); }
  70%  { transform: translate(-50%,-50%) translate(${N("clock-x")}px, ${N("clock-y")}px) rotate(${(N("swing-deg")*0.35).toFixed(1)}deg); }
  100% { transform: translate(-50%,-50%) translate(${N("clock-x")}px, ${N("clock-y")}px) rotate(0deg); }
}
@keyframes lc-tb-line {
  from { transform: translate(-50%,-50%) translate(${N("line-x")}px, ${N("line-y")}px) scaleX(0); }
  to   { transform: translate(-50%,-50%) translate(${N("line-x")}px, ${N("line-y")}px) scaleX(1); }
}
@keyframes lc-tb-text {
  from { opacity: 0; transform: translateY(-50%) scale(.86); }
  to   { opacity: 1; transform: translateY(-50%) scale(1); }
}
@keyframes lc-tb-out { from { opacity: 1; } to { opacity: 0; } }

/* 素材路径：
   钟   ${assetPath("p-clock")}
   红线 ${assetPath("p-line")}
   TURN ${assetPath("p-word")}
   总时长（JS 里移除元素用）：${T.total} ms */`;
}

for (const [id,,t] of P){ if (t !== "h") $(id).addEventListener("input", apply); }
apply();
</script>
