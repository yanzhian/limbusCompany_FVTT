<!doctype html>
<meta charset="utf-8">
<title>技能 Title 卡·排版调参</title>
<style>
:root{
  --bg-darkest:#0B0707; --bg-mid:#1A1210; --border-gold:#5F3E22;
  --text-main:#E8CAA2; --text-sub:#9B6839; --text-dim:#6E5540; --gold:#E7B956;
  --font-main:"Noto Sans SC","Microsoft YaHei",sans-serif;

  --card-w:280; --card-h:500;
  --hd-size:20; --hd-pad-x:12; --hd-pad-y:15; --lv-size:14;
  --info-pad-x:12; --info-pad-y:4; --info-gap:5;
  --sub-size:14; --cat-size:12; --sin-size:13;
  --fx-size:18;                 /* 骰式字号 */
  --wt-size:12; --wt-sq:12;     /* 攻击容量 标签字号 / 方块边长 */
  --flag-size:11; --flag-gap:4; --flag-pad-x:6; --flag-pad-y:1;
  --cost-size:12; --cost-gap:8;
  --tag-size:12; --tag-gap:6; --tag-pad-x:4; --tag-pad-y:0;
  --desc-size:12; --desc-lh:15; --desc-pad-x:14; --desc-pad-y:9;
  --foot-pad-x:14; --foot-pad-y:6; --foot-size:14;
}
body{margin:0;padding:16px;background:#141110;color:var(--text-main);
  font-family:var(--font-main);display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;}
h1{font-size:16px;margin:0 0 3px;letter-spacing:.06em;}
p.sub{margin:0 0 10px;font-size:12px;color:var(--text-dim);max-width:520px;line-height:1.7;}

/* ══ 卡片 ══ */
.limbus-title-card{position:relative;
  width:calc(var(--card-w)*1px);height:calc(var(--card-h)*1px);
  background:linear-gradient(180deg,var(--bg-darkest) 0%,var(--bg-mid) 50%,var(--bg-darkest) 100%);
  border:1px solid var(--border-gold);border-radius:4px;
  box-shadow:0 8px 32px rgba(0,0,0,.85);overflow:hidden;display:flex;flex-direction:column;}
.tc-header{font-size:calc(var(--hd-size)*1px);color:#E8CAA1;line-height:1.15;font-weight:bold;
  padding:calc(var(--hd-pad-y)*1px) calc(var(--hd-pad-x)*1px);
  display:flex;align-items:baseline;gap:8px;}
.tc-header .tc-name{flex:1;min-width:0;}
.tc-header .tc-lv{font-size:calc(var(--lv-size)*1px);flex-shrink:0;opacity:.92;letter-spacing:.06em;}

.tcs-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:calc(var(--info-pad-y)*1px) calc(var(--info-pad-x)*1px);}
.tcs-type{font-size:calc(var(--sub-size)*1px);color:#E8CAA1;font-weight:bold;
  border-bottom:1px solid rgba(201,168,76,.4);}
.tcs-cat{font-size:calc(var(--cat-size)*1px);color:#9B6839;display:inline-flex;align-items:center;gap:4px;}
.tcs-cat .ic{width:16px;height:16px;border-radius:3px;background:#2A1D12;display:inline-block;}
.tcs-sin{font-size:calc(var(--sin-size)*1px);font-weight:bold;margin-left:auto;
  display:inline-flex;align-items:center;gap:4px;}
.tcs-sin .ic{width:16px;height:16px;border-radius:50%;display:inline-block;}

.tcs-formula{font-size:calc(var(--fx-size)*1px);color:#E8CAA1;font-weight:bold;
  font-variant-numeric:tabular-nums;}
.tcs-dice{font-size:calc(var(--cat-size)*1px);color:#C9A84C;}

.tc-weight{display:flex;align-items:center;gap:4px;
  padding:calc(var(--info-pad-y)*1px) calc(var(--info-pad-x)*1px);}
.tc-weight-label{font-size:calc(var(--wt-size)*1px);color:#9B6839;margin-right:2px;}
.tc-weight-sq{width:calc(var(--wt-sq)*1px);height:calc(var(--wt-sq)*1px);
  background:#C9A84C;border-radius:2px;display:inline-block;}
.tcs-spread{font-size:calc(var(--cat-size)*1px);color:#B08A5E;margin-left:6px;}

.tcs-flags{display:flex;flex-wrap:wrap;gap:calc(var(--flag-gap)*1px);
  padding:calc(var(--info-pad-y)*1px) calc(var(--info-pad-x)*1px);}
.tcs-flag{font-size:calc(var(--flag-size)*1px);
  padding:calc(var(--flag-pad-y)*1px) calc(var(--flag-pad-x)*1px);
  border-radius:2px;border:1px solid currentColor;opacity:.95;}
.f-noequip{color:#C88A6A;} .f-noclash{color:#C4553D;}
.f-cover{color:#5DADE2;}   .f-indis{color:#B07FD6;}

.tcs-costs{display:flex;flex-wrap:wrap;gap:calc(var(--cost-gap)*1px);
  padding:calc(var(--info-pad-y)*1px) calc(var(--info-pad-x)*1px);
  font-size:calc(var(--cost-size)*1px);}
.tcs-cost-item{display:inline-flex;align-items:center;gap:3px;color:#E8CAA1;}
.tcs-cost-item .ic{width:14px;height:14px;border-radius:50%;display:inline-block;}
.tcs-cost-label{color:#9B6839;}

.tcs-res{display:flex;flex-wrap:wrap;gap:calc(var(--cost-gap)*1px);
  padding:calc(var(--info-pad-y)*1px) calc(var(--info-pad-x)*1px);
  font-size:calc(var(--cost-size)*1px);}
.tcs-res-item{display:inline-flex;align-items:center;gap:3px;}
.tcs-res-item .ic{width:14px;height:14px;border-radius:50%;display:inline-block;}

.tc-tags{display:flex;flex-wrap:wrap;gap:calc(var(--tag-gap)*1px);
  padding:calc(var(--info-pad-y)*1px) calc(var(--info-pad-x)*1px);}
.tc-skill-tag{font-size:calc(var(--tag-size)*1px);color:#B08A5E;
  padding:calc(var(--tag-pad-y)*1px) calc(var(--tag-pad-x)*1px);
  border:1px solid rgba(95,62,33,.6);border-radius:2px;background:rgba(0,0,0,.25);}

.tc-gold-divider-skill{height:1px;background:linear-gradient(90deg,transparent,#C9A84C,transparent);
  margin:4px 10px;flex-shrink:0;}
.tc-desc{padding:calc(var(--desc-pad-y)*1px) calc(var(--desc-pad-x)*1px);
  font-size:calc(var(--desc-size)*1px);color:#E8CAA1;
  line-height:calc(var(--desc-lh)/10);flex:1;min-height:0;overflow:auto;}
.tc-footer{display:flex;align-items:center;justify-content:flex-end;gap:4px;flex-shrink:0;
  padding:calc(var(--foot-pad-y)*1px) calc(var(--foot-pad-x)*1px);
  font-size:calc(var(--foot-size)*1px);}
.tc-footer .f-ic{width:18px;height:18px;border-radius:3px;background:#2A1D12;display:inline-block;}
.tc-footer .f-val{color:var(--gold);font-variant-numeric:tabular-nums;}

/* ══ 面板 ══ */
.panel{border:1px solid #2b2119;border-radius:4px;padding:12px 14px;width:400px;
  display:flex;flex-direction:column;gap:5px;max-height:94vh;overflow:auto;}
.seg{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:4px;}
.seg span{font-size:11px;padding:3px 9px;border-radius:999px;cursor:pointer;
  border:1px solid #3A2A1C;background:#15110E;color:var(--text-sub);}
.seg span.on{background:var(--gold);border-color:var(--gold);color:#15110E;font-weight:bold;}
h2{font-size:11.5px;color:var(--gold);margin:8px 0 1px;letter-spacing:.1em;font-weight:normal;}
.row{display:flex;align-items:center;gap:8px;font-size:12px;}
.row label{width:106px;color:var(--text-sub);}
.row input[type=range]{flex:1;min-width:80px;}
.row b{width:44px;text-align:right;color:var(--gold);font:11.5px monospace;}
.orderbox{border:1px solid #3A2A1C;border-radius:3px;padding:5px;background:#15110E;}
.orderbox .oi{display:flex;align-items:center;gap:6px;font-size:12px;padding:3px 5px;
  border-radius:2px;cursor:grab;color:var(--text-main);}
.orderbox .oi:hover{background:rgba(95,62,33,.3);}
.orderbox .oi.dragging{opacity:.4;}
.orderbox .oi .hnd{color:#6E5540;}
textarea{width:100%;height:190px;background:#15110E;border:1px solid #3A2A1C;border-radius:3px;
  color:var(--text-main);font:11px/1.5 monospace;padding:7px;resize:vertical;margin-top:6px;}
.note{font-size:11.5px;color:var(--text-dim);line-height:1.7;}
</style>

<div>
  <h1>技能 Title 卡·排版调参</h1>
  <p class="sub">三种技能各一份示例。<b>空的字段自动不显示</b>（下面「空值演示」可切成一张什么都没填的卡看效果）。
    区块可拖动排序、勾选显隐；调好把导出的 CSS 贴到
    <code>styles/limbusCompany_FVTT.css</code> 末尾，顺序我按清单改 JS。</p>
  <div id="card"></div>
</div>

<div class="panel">
  <div class="seg" id="seg">
    <span class="on" data-v="basic">基础技能</span>
    <span data-v="defense">守备技能</span>
    <span data-v="ego">E.G.O</span>
    <span data-v="empty">空值演示</span>
  </div>

  <h2>区块顺序（拖动排序 / 勾选显示）</h2>
  <div class="orderbox" id="order"></div>

  <div id="ctrls"></div>
  <textarea id="out" readonly></textarea>
  <div class="note">顺序与显隐每种类型各存一份；「空值演示」只是预览，不导出顺序。</div>
</div>

<script>
const $ = id => document.getElementById(id);

const P = [
  ["H0","","h",0,"卡片"],
  ["card-w","--card-w","n",280,"卡片宽"],
  ["card-h","--card-h","n",500,"卡片高"],
  ["H1","","h",0,"标题"],
  ["hd-size","--hd-size","n",20,"名称字号"],
  ["hd-pad-x","--hd-pad-x","n",12,"左右内距"],
  ["hd-pad-y","--hd-pad-y","n",15,"上下内距"],
  ["lv-size","--lv-size","n",14,"等级字号"],
  ["H2","","h",0,"信息行"],
  ["info-pad-x","--info-pad-x","n",12,"左右内距"],
  ["info-pad-y","--info-pad-y","n",4,"上下内距"],
  ["sub-size","--sub-size","n",14,"类型字号"],
  ["cat-size","--cat-size","n",12,"分类字号"],
  ["sin-size","--sin-size","n",13,"罪孽字号"],
  ["fx-size","--fx-size","n",18,"骰式字号"],
  ["H3","","h",0,"攻击容量"],
  ["wt-size","--wt-size","n",12,"标签字号"],
  ["wt-sq","--wt-sq","n",12,"方块边长"],
  ["H4","","h",0,"标记（布尔）"],
  ["flag-size","--flag-size","n",11,"字号"],
  ["flag-gap","--flag-gap","n",4,"间距"],
  ["flag-pad-x","--flag-pad-x","n",6,"左右内距"],
  ["flag-pad-y","--flag-pad-y","n",1,"上下内距"],
  ["H5","","h",0,"消耗 / 抗性"],
  ["cost-size","--cost-size","n",12,"字号"],
  ["cost-gap","--cost-gap","n",8,"项间距"],
  ["H6","","h",0,"标签"],
  ["tag-size","--tag-size","n",12,"字号"],
  ["tag-gap","--tag-gap","n",6,"间距"],
  ["tag-pad-x","--tag-pad-x","n",4,"左右内距"],
  ["tag-pad-y","--tag-pad-y","n",0,"上下内距"],
  ["H7","","h",0,"描述"],
  ["desc-size","--desc-size","n",12,"字号"],
  ["desc-lh","--desc-lh","n",15,"行高(÷10)"],
  ["desc-pad-x","--desc-pad-x","n",14,"左右内距"],
  ["desc-pad-y","--desc-pad-y","n",9,"上下内距"],
  ["H8","","h",0,"页脚"],
  ["foot-pad-x","--foot-pad-x","n",14,"左右内距"],
  ["foot-pad-y","--foot-pad-y","n",6,"上下内距"],
  ["foot-size","--foot-size","n",14,"字号"],
];
const RANGE = {
  "card-w":[200,420],"card-h":[280,720],"hd-size":[12,36],"hd-pad-x":[4,24],"hd-pad-y":[2,26],
  "lv-size":[8,24],"info-pad-x":[4,24],"info-pad-y":[0,16],"sub-size":[10,22],"cat-size":[8,20],
  "sin-size":[8,22],"fx-size":[10,28],"wt-size":[8,18],"wt-sq":[6,22],"flag-size":[8,18],
  "flag-gap":[0,12],"flag-pad-x":[0,14],"flag-pad-y":[0,8],"cost-size":[8,20],"cost-gap":[0,20],
  "tag-size":[8,18],"tag-gap":[0,12],"tag-pad-x":[0,12],"tag-pad-y":[0,8],
  "desc-size":[9,20],"desc-lh":[10,26],"desc-pad-x":[4,24],"desc-pad-y":[0,20],
  "foot-pad-x":[4,24],"foot-pad-y":[0,18],"foot-size":[8,22],
};
$("ctrls").innerHTML = P.map(([id,,t,def,zh]) => {
  if (t === "h") return `<h2>${zh}</h2>`;
  const [mn,mx] = RANGE[id] || [0,100];
  return `<div class="row"><label>${zh}</label>
    <input type="range" id="${id}" min="${mn}" max="${mx}" step="1" value="${def}"><b id="${id}-n"></b></div>`;
}).join("");

/* ── 区块 ── */
const BLOCKS = {
  header:  "名称 + 等级",
  typerow: "类型 · 分类 · 罪孽",
  formula: "骰式 + 骰子类型",
  weight:  "攻击容量 + 容量扩散",
  flags:   "标记（无法装备/无法拼点/援护防御/无差别）",
  costs:   "消耗（理智 / 罪孽资源）",
  resist:  "罪孽抗性修改",
  weapon:  "武器限制",
  tags:    "标签",
  divider1:"金线①",
  desc:    "效果描述",
  divider2:"金线②",
  footer:  "页脚（星芒）",
};
const BASE_ORDER = ["header","typerow","formula","weight","flags","costs","resist","weapon",
                    "tags","divider1","desc","divider2","footer"];
const state = {};
for (const k of ["basic","defense","ego"]) {
  state[k] = { order:[...BASE_ORDER], on:Object.fromEntries(BASE_ORDER.map(b => [b,true])) };
}
state.empty = { order:[...BASE_ORDER], on:Object.fromEntries(BASE_ORDER.map(b => [b,true])) };
let type = "basic";

const SIN = { 暴怒:"#C4553D", 色欲:"#C86A9E", 怠惰:"#C8A24E", 暴食:"#7BAE5C",
              忧郁:"#5C89C8", 傲慢:"#5EC8C0", 嫉妒:"#4E9E7E" };

const SAMPLE = {
  basic:   { name:"光斩", lv:"Lv.2", kind:"基础技能", cat:"斩击", sin:"忧郁",
             formula:"3D4+4", dice:"", weight:2, spread:"",
             flags:{noEquip:false,noClash:false,cover:false,indis:false},
             sanity:0, sinCost:[], res:[], weaponRes:"长刀",
             tags:["定事事务所","花札组"],
             desc:"[攻击时]：若你拥有【光札】，本次攻击的最终威力 +2。" },
  defense: { name:"花札·守", lv:"Lv.3", kind:"守备技能", cat:"可拼点格挡", sin:"嫉妒",
             formula:"2D6+5", dice:"不可摧毁", weight:0, spread:"",
             flags:{noEquip:false,noClash:false,cover:true,indis:false},
             sanity:0, sinCost:[], res:[], weaponRes:"",
             tags:["守备"],
             desc:"拼点胜利时无视本次伤害；拼点失败时减免格挡骰数的伤害。" },
  ego:     { name:"蝶自棺中而来", lv:"WAW", kind:"E.G.O", cat:"突刺", sin:"色欲",
             formula:"4D6+8", dice:"不可摧毁", weight:3, spread:"广域乱射 2 格",
             flags:{noEquip:true,noClash:false,cover:false,indis:true},
             sanity:15, sinCost:[["色欲",4],["忧郁",2]],
             res:[["色欲","x0.5"],["忧郁","x0.5"],["暴怒","x2.0"]], weaponRes:"",
             tags:["E.G.O装备","庄严哀悼"],
             desc:"[命中时]：为目标随机添加 3 层【蝶】。<br>[拼点胜利]：消耗 1 层【生蝶·亡蝶】，追加 2D4 固定伤害。" },
  empty:   { name:"未命名技能", lv:"", kind:"基础技能", cat:"", sin:"",
             formula:"", dice:"", weight:0, spread:"",
             flags:{noEquip:false,noClash:false,cover:false,indis:false},
             sanity:0, sinCost:[], res:[], weaponRes:"", tags:[], desc:"" },
};

const dot = c => `<span class="ic" style="background:${c}"></span>`;

function blockHtml(b, d){
  switch (b) {
    case "header":
      return `<div class="tc-header" style="background:${SIN[d.sin] ?? "#5F3E21"}">
        <span class="tc-name">${d.name}</span>
        ${d.lv ? `<span class="tc-lv">${d.lv}</span>` : ""}</div>`;
    case "typerow": {
      if (!d.kind && !d.cat && !d.sin) return "";
      return `<div class="tcs-row">
        ${d.kind ? `<span class="tcs-type">${d.kind}</span>` : ""}
        ${d.cat ? `<span class="tcs-cat"><span class="ic"></span>${d.cat}</span>` : ""}
        ${d.sin ? `<span class="tcs-sin" style="color:${SIN[d.sin]}">${dot(SIN[d.sin])}${d.sin}</span>` : ""}
      </div>`;
    }
    case "formula":
      if (!d.formula) return "";
      return `<div class="tcs-row"><span class="tcs-formula">${d.formula}</span>
        ${d.dice ? `<span class="tcs-dice">${d.dice}</span>` : ""}</div>`;
    case "weight":
      if (!d.weight) return "";
      return `<div class="tc-weight"><span class="tc-weight-label">攻击容量</span>
        ${Array.from({length:d.weight},()=>'<span class="tc-weight-sq"></span>').join("")}
        ${d.spread ? `<span class="tcs-spread">${d.spread}</span>` : ""}</div>`;
    case "flags": {
      const f = d.flags, out = [];
      if (f.noEquip) out.push(`<span class="tcs-flag f-noequip">无法装备</span>`);
      if (f.noClash) out.push(`<span class="tcs-flag f-noclash">无法拼点</span>`);
      if (f.cover)   out.push(`<span class="tcs-flag f-cover">援护防御</span>`);
      if (f.indis)   out.push(`<span class="tcs-flag f-indis">无差别攻击</span>`);
      return out.length ? `<div class="tcs-flags">${out.join("")}</div>` : "";
    }
    case "costs": {
      const out = [];
      if (d.sanity) out.push(`<span class="tcs-cost-item"><span class="tcs-cost-label">理智</span>${d.sanity}</span>`);
      for (const [s,n] of d.sinCost)
        out.push(`<span class="tcs-cost-item">${dot(SIN[s])}${s} ${n}</span>`);
      return out.length ? `<div class="tcs-costs">${out.join("")}</div>` : "";
    }
    case "resist":
      return d.res.length ? `<div class="tcs-res">${d.res.map(([s,v]) =>
        `<span class="tcs-res-item" style="color:${SIN[s]}">${dot(SIN[s])}${v}</span>`).join("")}</div>` : "";
    case "weapon":
      return d.weaponRes ? `<div class="tcs-row"><span class="tcs-cat">武器限制：${d.weaponRes}</span></div>` : "";
    case "tags":
      return d.tags.length ? `<div class="tc-tags">${d.tags.map(t =>
        `<span class="tc-skill-tag">${t}</span>`).join("")}</div>` : "";
    case "divider1":
    case "divider2": return `<div class="tc-gold-divider-skill"></div>`;
    case "desc":     return d.desc ? `<div class="tc-desc">${d.desc}</div>` : `<div class="tc-desc"></div>`;
    case "footer":   return `<div class="tc-footer"><span class="f-ic"></span><span class="f-val">5</span></div>`;
  }
  return "";
}
function renderCard(){
  const d = SAMPLE[type], st = state[type];
  $("card").innerHTML = `<div class="limbus-title-card limbus-title-card-skill">
    ${st.order.filter(b => st.on[b]).map(b => blockHtml(b, d)).join("")}
  </div>`;
}

function renderOrder(){
  const st = state[type];
  $("order").innerHTML = st.order.map(b => `
    <div class="oi" draggable="true" data-b="${b}">
      <span class="hnd">⋮⋮</span>
      <input type="checkbox" ${st.on[b] ? "checked" : ""}>
      <span>${BLOCKS[b]}</span></div>`).join("");
  let dragEl = null;
  $("order").querySelectorAll(".oi").forEach(el => {
    el.addEventListener("dragstart", () => { dragEl = el; el.classList.add("dragging"); });
    el.addEventListener("dragend",   () => { el.classList.remove("dragging"); dragEl = null; commitOrder(); });
    el.addEventListener("dragover",  ev => {
      ev.preventDefault();
      if (!dragEl || dragEl === el) return;
      const box = el.getBoundingClientRect();
      el.parentNode.insertBefore(dragEl, (ev.clientY - box.top) > box.height/2 ? el.nextSibling : el);
    });
    el.querySelector("input").addEventListener("change", ev => {
      state[type].on[el.dataset.b] = ev.target.checked; renderCard(); dump();
    });
  });
}
function commitOrder(){
  state[type].order = [...$("order").querySelectorAll(".oi")].map(el => el.dataset.b);
  renderCard(); dump();
}

const N = id => Number($(id).value);
function apply(){
  const rs = document.documentElement.style;
  for (const [id,v,t] of P){ if (t === "h") continue; rs.setProperty(v, N(id)); $(id+"-n").textContent = N(id); }
  renderCard(); dump();
}
function dump(){
  const orders = ["basic","defense","ego"].map(k =>
    `  ${k.padEnd(8)}: ${state[k].order.filter(b => state[k].on[b]).join(" → ")}`).join("\n");
  $("out").value =
