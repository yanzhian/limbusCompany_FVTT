<!doctype html>
<meta charset="utf-8">
<title>物品 Title 卡·排版调参</title>
<style>
:root{
  --bg-darkest:#0B0707; --bg-mid:#1A1210; --border-gold:#5F3E22;
  --text-main:#E8CAA2; --text-sub:#9B6839; --text-dim:#6E5540; --gold:#E7B956;
  --font-main:"Noto Sans SC","Microsoft YaHei",sans-serif;

  /* ── 卡片 ── */
  --card-w:280;  --card-h:500;
  /* ── 标题 ── */
  --hd-size:32; --hd-pad-x:12; --hd-pad-t:10; --hd-pad-b:8;
  --hd-bg:#5F3E21; --hd-col:#E8CAA1;
  /* ── 信息行 ── */
  --info-pad-x:12; --info-pad-t:6; --info-gap:5;
  --sub-size:14;  --cat-size:12; --rar-size:13;
  /* ── 修正值行 ── */
  --mod-gap:10; --mod-ic:18; --mod-size:14;
  /* ── 标签 ── */
  --tag-size:11; --tag-gap:3; --tag-pad-x:6; --tag-pad-y:2;
  /* ── 描述 ── */
  --desc-size:12.5; --desc-lh:16; --desc-pad-x:12; --desc-pad-y:6;
  /* ── 页脚 ── */
  --foot-pad-x:12; --foot-pad-y:6; --foot-size:14;
}
body{margin:0;padding:16px;background:#141110;color:var(--text-main);
  font-family:var(--font-main);display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;}
h1{font-size:16px;margin:0 0 3px;letter-spacing:.06em;}
p.sub{margin:0 0 10px;font-size:12px;color:var(--text-dim);max-width:520px;line-height:1.7;}

/* ══ 卡片本体（与 styles/ 里 .limbus-title-card-equip 同结构） ══ */
.limbus-title-card{
  position:relative;
  width:calc(var(--card-w)*1px); height:calc(var(--card-h)*1px);
  background:linear-gradient(180deg,var(--bg-darkest) 0%,var(--bg-mid) 50%,var(--bg-darkest) 100%);
  border:1px solid var(--border-gold); border-radius:4px;
  box-shadow:0 8px 32px rgba(0,0,0,.85); overflow:hidden;
  display:flex; flex-direction:column;
}
.tce-header{
  font-size:calc(var(--hd-size)*1px); color:var(--hd-col); background:var(--hd-bg);
  padding:calc(var(--hd-pad-t)*1px) calc(var(--hd-pad-x)*1px) calc(var(--hd-pad-b)*1px);
  line-height:1.1; font-weight:bold;
}
.tce-info-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
  padding:calc(var(--info-pad-t)*1px) calc(var(--info-pad-x)*1px) 4px;}
.tce-info-left{flex:1;min-width:0;display:flex;flex-direction:column;gap:calc(var(--info-gap)*1px);}
.tce-subrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.tce-subtype{font-size:calc(var(--sub-size)*1px);color:#E8CAA1;font-weight:bold;
  border-bottom:1px solid rgba(201,168,76,.4);}
.tce-category{font-size:calc(var(--cat-size)*1px);color:#9B6839;}
.tce-rarity{font-size:calc(var(--rar-size)*1px);font-weight:bold;margin-left:auto;
  letter-spacing:.06em;}
.tce-modifiers{display:flex;flex-wrap:wrap;gap:calc(var(--mod-gap)*1px);}
.modifier-row{display:flex;align-items:center;gap:3px;}
.modifier-row .mod-icon{width:calc(var(--mod-ic)*1px);height:calc(var(--mod-ic)*1px);
  border-radius:3px;background:#2A1D12;display:inline-block;}
.modifier-row .mod-val,.modifier-row .resist-display{
  font-size:calc(var(--mod-size)*1px);color:#E8CAA1;font-variant-numeric:tabular-nums;}
.tce-tags{display:flex;flex-wrap:wrap;gap:calc(var(--tag-gap)*1px);}
.tc-skill-tag{font-size:calc(var(--tag-size)*1px);color:#B08A5E;
  padding:calc(var(--tag-pad-y)*1px) calc(var(--tag-pad-x)*1px);
  border:1px solid rgba(95,62,33,.6);border-radius:2px;background:rgba(0,0,0,.25);}
.tc-gold-divider-skill{height:1px;background:linear-gradient(90deg,transparent,#C9A84C,transparent);
  margin:4px 10px;flex-shrink:0;}
.tce-desc{padding:calc(var(--desc-pad-y)*1px) calc(var(--desc-pad-x)*1px);
  font-size:calc(var(--desc-size)*1px);color:#E8CAA1;
  line-height:calc(var(--desc-lh)/10);flex:1;min-height:0;overflow:auto;}
.tce-footer{padding:calc(var(--foot-pad-y)*1px) calc(var(--foot-pad-x)*1px)
  calc(var(--foot-pad-y)*1px + 2px);display:flex;align-items:center;gap:6px;flex-shrink:0;
  font-size:calc(var(--foot-size)*1px);}
.tce-footer .f-ic{width:18px;height:18px;border-radius:3px;background:#2A1D12;display:inline-block;}
.tce-footer .f-val{color:var(--gold);font-variant-numeric:tabular-nums;}
.tce-footer .f-sep{flex:1;}

/* ══ 面板 ══ */
.panel{border:1px solid #2b2119;border-radius:4px;padding:12px 14px;width:400px;
  display:flex;flex-direction:column;gap:5px;max-height:94vh;overflow:auto;}
.seg{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:4px;}
.seg span{font-size:11px;padding:3px 9px;border-radius:999px;cursor:pointer;
  border:1px solid #3A2A1C;background:#15110E;color:var(--text-sub);}
.seg span.on{background:var(--gold);border-color:var(--gold);color:#15110E;font-weight:bold;}
h2{font-size:11.5px;color:var(--gold);margin:8px 0 1px;letter-spacing:.1em;font-weight:normal;}
.row{display:flex;align-items:center;gap:8px;font-size:12px;}
.row label{width:106px;color:var(--text-sub);}
.row input[type=range]{flex:1;min-width:80px;}
.row b{width:44px;text-align:right;color:var(--gold);font:11.5px monospace;}
.orderbox{border:1px solid #3A2A1C;border-radius:3px;padding:5px;background:#15110E;}
.orderbox .oi{display:flex;align-items:center;gap:6px;font-size:12px;padding:3px 5px;
  border-radius:2px;cursor:grab;color:var(--text-main);}
.orderbox .oi:hover{background:rgba(95,62,33,.3);}
.orderbox .oi.dragging{opacity:.4;}
.orderbox .oi .hnd{color:#6E5540;}
.orderbox .oi input{margin:0;}
textarea{width:100%;height:180px;background:#15110E;border:1px solid #3A2A1C;border-radius:3px;
  color:var(--text-main);font:11px/1.5 monospace;padding:7px;resize:vertical;margin-top:6px;}
.note{font-size:11.5px;color:var(--text-dim);line-height:1.7;}
</style>

<div>
  <h1>物品 Title 卡·排版调参</h1>
  <p class="sub">左边是实时预览。上面切物品类型，右边调尺寸；<b>「区块顺序」可以直接拖动排序</b>，
    勾选框控制显示/隐藏。调好后把底部导出的 CSS 贴到
    <code>styles/limbusCompany_FVTT.css</code> 末尾，顺序改动我按导出的清单改 JS。</p>
  <div id="card"></div>
</div>

<div class="panel">
  <div class="seg" id="seg">
    <span class="on" data-v="upper">上装</span><span data-v="lower">下装</span>
    <span data-v="weapon">武器</span><span data-v="accessory">饰品</span>
    <span data-v="material">材料</span><span data-v="consumable">消耗品</span>
    <span data-v="container">容器</span>
  </div>

  <h2>区块顺序（拖动排序 / 勾选显示）</h2>
  <div class="orderbox" id="order"></div>

  <div id="ctrls"></div>
  <textarea id="out" readonly></textarea>
  <div class="note">顺序与显隐是每种类型各存一份的，切类型会各自记住。</div>
</div>

<script>
const $ = id => document.getElementById(id);

/* ── 可调尺寸 ── */
const P = [
  ["H0","","h",0,"卡片"],
  ["card-w","--card-w","n",280,"卡片宽"],
  ["card-h","--card-h","n",500,"卡片高"],
  ["H1","","h",0,"标题"],
  ["hd-size","--hd-size","n",32,"标题字号"],
  ["hd-pad-x","--hd-pad-x","n",12,"标题左右内距"],
  ["hd-pad-t","--hd-pad-t","n",10,"标题上内距"],
  ["hd-pad-b","--hd-pad-b","n",8,"标题下内距"],
  ["H2","","h",0,"信息区"],
  ["info-pad-x","--info-pad-x","n",12,"左右内距"],
  ["info-pad-t","--info-pad-t","n",6,"上内距"],
  ["info-gap","--info-gap","n",5,"行间距"],
  ["sub-size","--sub-size","n",14,"子类型字号"],
  ["cat-size","--cat-size","n",12,"分类字号"],
  ["rar-size","--rar-size","n",13,"稀有度字号"],
  ["H3","","h",0,"修正值"],
  ["mod-gap","--mod-gap","n",10,"项间距"],
  ["mod-ic","--mod-ic","n",18,"图标边长"],
  ["mod-size","--mod-size","n",14,"数值字号"],
  ["H4","","h",0,"标签"],
  ["tag-size","--tag-size","n",11,"字号"],
  ["tag-gap","--tag-gap","n",3,"间距"],
  ["tag-pad-x","--tag-pad-x","n",6,"左右内距"],
  ["tag-pad-y","--tag-pad-y","n",2,"上下内距"],
  ["H5","","h",0,"描述"],
  ["desc-size","--desc-size","n",12.5,"字号"],
  ["desc-lh","--desc-lh","n",16,"行高(÷10)"],
  ["desc-pad-x","--desc-pad-x","n",12,"左右内距"],
  ["desc-pad-y","--desc-pad-y","n",6,"上下内距"],
  ["H6","","h",0,"页脚"],
  ["foot-pad-x","--foot-pad-x","n",12,"左右内距"],
  ["foot-pad-y","--foot-pad-y","n",6,"上下内距"],
  ["foot-size","--foot-size","n",14,"字号"],
];
const RANGE = {
  "card-w":[200,420],"card-h":[280,720],"hd-size":[16,44],"hd-pad-x":[4,24],
  "hd-pad-t":[2,20],"hd-pad-b":[2,20],"info-pad-x":[4,24],"info-pad-t":[0,20],
  "info-gap":[0,16],"sub-size":[10,22],"cat-size":[8,20],"rar-size":[8,22],"mod-gap":[2,24],
  "mod-ic":[10,28],"mod-size":[8,22],"tag-size":[8,18],"tag-gap":[0,10],
  "tag-pad-x":[0,14],"tag-pad-y":[0,10],"desc-size":[9,20],"desc-lh":[10,26],
  "desc-pad-x":[4,24],"desc-pad-y":[0,18],"foot-pad-x":[4,24],"foot-pad-y":[0,18],
  "foot-size":[8,22],
};

$("ctrls").innerHTML = P.map(([id,,t,def,zh]) => {
  if (t === "h") return `<h2>${zh}</h2>`;
  const [mn,mx] = RANGE[id] || [0,100];
  const step = id === "desc-size" ? 0.5 : 1;
  return `<div class="row"><label>${zh}</label>
    <input type="range" id="${id}" min="${mn}" max="${mx}" step="${step}" value="${def}"><b id="${id}-n"></b></div>`;
}).join("");

/* ── 区块定义 ── */
const BLOCKS = {
  header:  "名称（标题条）",
  subrow:  "类型 · 分类 · 稀有度",
  mods:    "修正值（攻/防/速/抗性）",
  tags:    "标签",
  qty:     "数量 / 内部网格",
  divider1:"金线①",
  desc:    "效果描述",
  divider2:"金线②",
  footer:  "页脚（星芒 / 眼 / 容量）",
};
/* 每种类型的默认顺序与显隐 */
const DEFAULT_ORDER = {
  upper:      ["header","subrow","mods","tags","divider1","desc","divider2","footer"],
  lower:      ["header","subrow","mods","tags","divider1","desc","divider2","footer"],
  weapon:     ["header","subrow","mods","tags","divider1","desc","divider2","footer"],
  accessory:  ["header","subrow","mods","tags","divider1","desc","divider2","footer"],
  material:   ["header","subrow","qty","tags","divider1","desc","divider2","footer"],
  consumable: ["header","subrow","qty","tags","divider1","desc","divider2","footer"],
  container:  ["header","subrow","qty","tags","divider1","desc","divider2","footer"],
};
const state = {};
for (const [k, list] of Object.entries(DEFAULT_ORDER)) {
  state[k] = { order: [...list], on: Object.fromEntries(Object.keys(BLOCKS).map(b => [b, list.includes(b)])) };
}
let type = "upper";

/* ── 示例数据 ── */
const SAMPLE = {
  upper:      { name:"中指-怨恨纹身", sub:"上装", cat:"西服-纹身", rarity:["精良","#5DADE2"],
                mods:[["斩","x0.5"],["打","x1.0"],["突","x2.0"],["DEF","+4"]],
                tags:["手指","中指"], qty:"", desc:"永不遗忘。受到打击伤害时，为攻击者添加 1 层【流血】。" },
  lower:      { name:"油布长裤", sub:"下装", cat:"工装", rarity:["平装","#7FB57F"],
                mods:[["DEF","+2"],["SPD","+1"]], tags:["工装"], qty:"",
                desc:"耐磨，兜里总能摸出点什么。" },
  weapon:     { name:"定事事务所·打刀", sub:"武器", cat:"长刀", rarity:["史诗","#B07FD6"],
                mods:[["ATK","+3"],["DEF","+1"],["SPD","-1"]], tags:["刀","定事事务所"], qty:"",
                desc:"[攻击时]：若你拥有【光札】，本次攻击的最终威力 +2。" },
  accessory:  { name:"银质怀表", sub:"饰品", cat:"配饰", rarity:["艺术","#E7B956"],
                mods:[["ATK","+1"],["SPD","+2"]], tags:["配饰"], qty:"",
                desc:"[回合开始时]：为自己添加 1 层【迅捷】。" },
  material:   { name:"残响核心", sub:"材料", cat:"异常", rarity:["神话","#E0554B"],
                mods:[], tags:["异常","核心"], qty:"数量 ×12　容量 1×1",
                desc:"还在微微震动。用于制作高级装备。" },
  consumable: { name:"紧急恢复针剂", sub:"消耗品", cat:"医疗", rarity:["平装","#7FB57F"],
                mods:[], tags:["医疗","一次性"], qty:"数量 ×3　容量 1×1",
                desc:"[使用时]：恢复 2D6 点生命值，并移除 1 层【流血】。" },
  container:  { name:"小型木箱", sub:"容器", cat:"建筑", rarity:["平装","#7FB57F"],
                mods:[], tags:["建材"], qty:"容量 3×2　内部 4×8",
                desc:"能装不少东西，但自己也挺占地方。" },
};

/* ── 渲染 ── */
function blockHtml(b, d){
  switch (b) {
    case "header":  return `<div class="tce-header">${d.name}</div>`;
    case "subrow":  return `<div class="tce-info-row"><div class="tce-info-left">
      <div class="tce-subrow"><span class="tce-subtype">${d.sub}</span>
      ${d.cat ? `<span class="tce-category">${d.cat}</span>` : ""}
      <span class="tce-rarity" style="color:${d.rarity[1]}">${d.rarity[0]}</span></div></div></div>`;
    case "mods":    return d.mods.length ? `<div class="tce-info-row"><div class="tce-info-left">
      <div class="tce-modifiers">${d.mods.map(([k,v]) =>
        `<span class="modifier-row"><span class="mod-icon" title="${k}"></span><span class="mod-val">${v}</span></span>`).join("")}
      </div></div></div>` : "";
    case "tags":    return d.tags.length ? `<div class="tce-info-row"><div class="tce-info-left">
      <div class="tce-tags">${d.tags.map(t => `<span class="tc-skill-tag">${t}</span>`).join("")}</div>
      </div></div>` : "";
    case "qty":     return d.qty ? `<div class="tce-info-row"><div class="tce-info-left">
      <div class="tce-subrow"><span class="tce-category">${d.qty}</span></div></div></div>` : "";
    case "divider1":
    case "divider2":return `<div class="tc-gold-divider-skill"></div>`;
    case "desc":    return `<div class="tce-desc">${d.desc}</div>`;
    case "footer":  return `<div class="tce-footer"><span class="f-ic"></span><span class="f-val">2</span>
      <span class="f-sep"></span><span class="f-ic"></span><span class="f-val">240</span></div>`;
  }
  return "";
}
function renderCard(){
  const d = SAMPLE[type], st = state[type];
  $("card").innerHTML = `<div class="limbus-title-card limbus-title-card-equip">
    ${st.order.filter(b => st.on[b]).map(b => blockHtml(b, d)).join("")}
  </div>`;
}

/* ── 顺序面板（原生拖放排序） ── */
function renderOrder(){
  const st = state[type];
  $("order").innerHTML = st.order.map(b => `
    <div class="oi" draggable="true" data-b="${b}">
      <span class="hnd">⋮⋮</span>
      <input type="checkbox" ${st.on[b] ? "checked" : ""}>
      <span>${BLOCKS[b]}</span>
    </div>`).join("");

  let dragEl = null;
  $("order").querySelectorAll(".oi").forEach(el => {
    el.addEventListener("dragstart", () => { dragEl = el; el.classList.add("dragging"); });
    el.addEventListener("dragend",   () => { el.classList.remove("dragging"); dragEl = null; commitOrder(); });
    el.addEventListener("dragover",  ev => {
      ev.preventDefault();
      if (!dragEl || dragEl === el) return;
      const box = el.getBoundingClientRect();
      const after = (ev.clientY - box.top) > box.height / 2;
      el.parentNode.insertBefore(dragEl, after ? el.nextSibling : el);
    });
    el.querySelector("input").addEventListener("change", ev => {
      state[type].on[el.dataset.b] = ev.target.checked;
      renderCard(); dump();
    });
  });
}
function commitOrder(){
  state[type].order = [...$("order").querySelectorAll(".oi")].map(el => el.dataset.b);
  renderCard(); dump();
}

/* ── 应用 & 导出 ── */
const N = id => Number($(id).value);
function apply(){
  const rs = document.documentElement.style;
  for (const [id, v, t] of P){
    if (t === "h") continue;
    rs.setProperty(v, N(id));
    $(id + "-n").textContent = N(id);
  }
  renderCard(); dump();
}
function dump(){
  const orders = Object.entries(state).map(([k, st]) =>
    `  ${k.padEnd(11)}: ${st.order.filter(b => st.on[b]).join(" → ")}`).join("\n");
  $("out").value =
`/* ══ 物品 Title 卡·排版（调参台导出） ══ */
.limbus-title-card { width: ${N("card-w")}px; height: ${N("card-h")}px; max-height: ${N("card-h")}px; }

.limbus-title-card-equip .tce-header {
  font-size: ${N("hd-size")}px;
  padding: ${N("hd-pad-t")}px ${N("hd-pad-x")}px ${N("hd-pad-b")}px;
}
.limbus-title-card-equip .tce-info-row {
  padding: ${N("info-pad-t")}px ${N("info-pad-x")}px 4px;
}
.limbus-title-card-equip .tce-info-left { gap: ${N("info-gap")}px; }
.limbus-title-card-equip .tce-subtype   { font-size: ${N("sub-size")}px; }
.limbus-title-card-equip .tce-category  { font-size: ${N("cat-size")}px; }
/* 稀有度：并在「类型·分类」同一排，靠右 */
.limbus-title-card-equip .tce-rarity {
  font-size: ${N("rar-size")}px; font-weight: bold;
  margin-left: auto; letter-spacing: .06em;
}

.limbus-title-card-equip .tce-modifiers { gap: ${N("mod-gap")}px; }
.limbus-title-card-equip .modifier-row .mod-icon {
  width: ${N("mod-ic")}px; height: ${N("mod-ic")}px;
}
.limbus-title-card-equip .modifier-row .mod-val,
.limbus-title-card-equip .modifier-row .resist-display { font-size: ${N("mod-size")}px; }

.limbus-title-card-equip .tce-tags { gap: ${N("tag-gap")}px; }
.limbus-title-card-equip .tce-tags .tc-skill-tag {
  font-size: ${N("tag-size")}px; padding: ${N("tag-pad-y")}px ${N("tag-pad-x")}px;
}

.limbus-title-card-equip .tce-desc {
  font-size: ${N("desc-size")}px; line-height: ${(N("desc-lh")/10).toFixed(1)};
  padding: ${N("desc-pad-y")}px ${N("desc-pad-x")}px;
}
.limbus-title-card-equip .tce-footer {
  font-size: ${N("foot-size")}px;
  padding: ${N("foot-pad-y")}px ${N("foot-pad-x")}px ${N("foot-pad-y") + 2}px;
}

/* ── 区块顺序（照这个改 buildItemTitleCard 的拼装顺序）──
${orders}
*/`;
}

for (const [id,,t] of P){ if (t !== "h") $(id).addEventListener("input", apply); }
$("seg").addEventListener("click", ev => {
  const v = ev.target?.dataset?.v; if (!v) return;
  [...$("seg").children].forEach(c => c.classList.toggle("on", c.dataset.v === v));
  type = v; renderOrder(); renderCard(); dump();
});

renderOrder();
apply();
</script>
