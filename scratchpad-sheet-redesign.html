<!doctype html>
<meta charset="utf-8">
<title>角色卡·改良版调参</title>
<style>
/* ══════════════════════════════════════════════════════════════
   预览区：照 character-sheet-redesign.css 复刻，所有可调项都走
   CSS 变量，右侧面板直接改变量 → 实时生效 → 底部导出覆盖用 CSS。
   ══════════════════════════════════════════════════════════════ */
:root{
  /* 色板 */
  --gold-bright:#E8CAA2; --gold:#C99B52; --gold-dim:#725332; --copper:#8E4D2F;
  --ink:#090706; --surface:#12100D; --text:#E8D2AE; --muted:#9B8061;

  /* 结构 */
  --rail-w:30px;
  --head-left:260px; --head-mid:220px;
  --head-gap:10px; --head-minh:216px; --head-pad-y:10px; --head-pad-x:12px;
  --col-pad:8px; --col-gap:5px; --col-accent:2px;

  /* 头部内元素 */
  --avatar:100px; --bar-w:190px; --bar-h:28px;
  --infolabel-h:26px; --infolabel-mb:6px;
  --inforow-h:52px; --info-icon:28px; --info-font:22px;
  --name-font:30px;
  --attr-h:68px; --attr-gap:5px; --attr-label:13px; --attr-value:18px;

  /* 导航 / 工作区 / 底栏 */
  --tab-h:38px; --tab-font:13px; --tab-track:.16em; --tab-bar:2px;
  --panel-w:275px; --panel-pad-y:10px; --panel-pad-x:12px;
  --panel-title-h:45px; --panel-title-font:20px;
  --slot:70px; --slot-gap:10px;
  --foot-h:40px;

  --font-main:"Noto Sans SC","Microsoft YaHei",sans-serif;
  --font-serif:Georgia,"Noto Serif SC","Microsoft YaHei",serif;
}
body{margin:0;padding:16px;background:#070605;color:var(--text);
  font-family:var(--font-main);display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;}
h1{font-size:15px;margin:0 0 8px;letter-spacing:.06em;}

/* ── 卡片本体 ───────────────────────────────────────────── */
.sheet{
  position:relative;width:880px;height:760px;display:flex;flex-direction:column;overflow:hidden;
  color:var(--text);
  background:
    radial-gradient(circle at 82% 8%, rgba(142,77,47,.16), transparent 30%),
    radial-gradient(circle at 12% 42%, rgba(201,155,82,.06), transparent 36%),
    linear-gradient(180deg,#0A0807 0%,#17130F 52%,#090706 100%);
  border:1px solid #5E4328;
  box-shadow:inset 0 0 0 1px rgba(232,202,162,.05), inset 0 0 70px rgba(0,0,0,.38);
}
.sheet::before{content:"";position:absolute;inset:4px;z-index:20;
  border:1px solid rgba(201,155,82,.14);pointer-events:none;}

/* 身份区 */
.identity{position:relative;flex:0 0 auto;padding-left:var(--rail-w);
  background:
    linear-gradient(90deg, rgba(29,17,11,.92), rgba(14,12,10,.84) 43%, rgba(36,22,14,.82)),
    repeating-linear-gradient(90deg, transparent 0 39px, rgba(232,202,162,.018) 40px);
  border-bottom:1px solid var(--gold-dim);}
.identity::after{content:"";position:absolute;left:18%;right:8%;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);}
.rail{position:absolute;inset:0 auto 0 0;width:var(--rail-w);display:flex;flex-direction:column;
  align-items:center;padding:10px 0;background:linear-gradient(180deg,#31180F,#140E0A);
  border-right:1px solid #704629;color:var(--gold);font-family:var(--font-serif);letter-spacing:.08em;}
.rail .code{writing-mode:vertical-rl;font-size:11px;}
.rail .line{width:1px;flex:1;margin:8px 0;background:linear-gradient(transparent,var(--gold),transparent);}
.rail .idx{writing-mode:vertical-rl;font-size:9px;color:var(--muted);}

.head{display:grid;grid-template-columns:var(--head-left) var(--head-mid) minmax(0,1fr);
  gap:var(--head-gap);min-height:var(--head-minh);padding:var(--head-pad-y) var(--head-pad-x) 9px;}
.col{min-width:0;display:flex;flex-direction:column;padding:var(--col-pad);gap:var(--col-gap);
  background:linear-gradient(155deg, rgba(33,26,20,.72), rgba(12,10,8,.54));
  border-top:1px solid rgba(232,202,162,.12);border-bottom:1px solid rgba(201,155,82,.22);}
.col-l{border-left:var(--col-accent) solid var(--copper);}
.col-m{border-left:var(--col-accent) solid #755B3A;}
.col-r{border-left:var(--col-accent) solid var(--gold-dim);}

.avatar-row{display:flex;gap:10px;align-items:flex-start;}
.avatar{width:var(--avatar);height:var(--avatar);flex:0 0 auto;background:#2a1f18;
  border:1px solid #9C7040;
  box-shadow:0 0 0 3px rgba(9,7,6,.82),0 0 0 4px rgba(201,155,82,.24),0 8px 18px rgba(0,0,0,.4);}
.lv{font-size:26px;font-weight:bold;color:var(--gold-bright);line-height:1;}
.xp{width:134px;height:8px;background:#2A2723;margin-top:6px;}
.xp i{display:block;width:62%;height:100%;background:linear-gradient(90deg,#782B20,#C44B30);}
.bar{width:var(--bar-w);height:var(--bar-h);background:#0B0908;border:1px solid rgba(201,155,82,.18);
  position:relative;margin-top:5px;}
.bar i{position:absolute;inset:0;width:60%;}
.bar.hp i{background:linear-gradient(90deg,#681D1B,#B43A2D);}
.bar.san i{background:linear-gradient(90deg,#173956,#3577A2);width:52%;}
.bar b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:13px;color:#F0DFC0;}

.iblock{margin:0 0 10px;}
.ilabel{position:relative;height:var(--infolabel-h);line-height:var(--infolabel-h);
  margin-bottom:var(--infolabel-mb);background:linear-gradient(90deg,#3A2112,rgba(58,33,18,.25));
  border-left:3px solid var(--gold);color:#E6B86F;text-align:left;padding-left:10px;
  font-size:.8rem;font-weight:bold;letter-spacing:.05em;}
.irow{display:flex;align-items:center;justify-content:space-between;gap:5px;
  width:100%;height:var(--inforow-h);}
.irow .ic{width:var(--info-icon);height:var(--info-icon);background:#3a2a1c;border-radius:2px;flex:0 0 auto;}
.irow .v{min-width:28px;font-size:var(--info-font);text-align:center;color:var(--gold-bright);line-height:1;}

.bg-tag{width:100%;border-left:3px solid var(--copper);
  background:linear-gradient(90deg,#321D12,rgba(50,29,18,.16));color:#B98855;
  text-align:left;padding:3px 10px;font-size:12px;}
.name{min-height:52px;display:flex;align-items:center;
  font-family:var(--font-serif);font-size:var(--name-font);font-weight:500;letter-spacing:.05em;
  color:var(--gold-bright);text-shadow:0 2px 10px rgba(0,0,0,.6);padding:0 8px;}
.attrs{display:flex;gap:var(--attr-gap);height:calc(var(--attr-h) + 8px);align-items:center;}
.attr{flex:1 1 0;min-width:43px;height:var(--attr-h);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;
  background:linear-gradient(180deg,#50331C,#24170F);border-bottom:2px solid #785533;
  box-shadow:inset 0 1px rgba(232,202,162,.1);}
.attr .l{font-size:var(--attr-label);font-weight:500;color:#E8C9A2;line-height:1;}
.attr .v{font-size:var(--attr-value);font-weight:bold;color:var(--text);line-height:1;}
.attr .btn{width:18px;height:7px;background:#805735;}

/* 导航 */
.tabs{position:relative;z-index:2;display:grid;grid-template-columns:repeat(3,1fr);
  height:var(--tab-h);padding:0 var(--rail-w);background:#0B0908;border-bottom:1px solid #5C4128;}
.tabs a{position:relative;display:flex;align-items:center;justify-content:center;gap:7px;
  color:#876E53;font-size:var(--tab-font);letter-spacing:var(--tab-track);cursor:pointer;}
.tabs a::after{content:"";position:absolute;left:24%;right:24%;bottom:0;height:var(--tab-bar);
  background:transparent;transition:left .16s,right .16s,background .16s;}
.tabs a.on{color:#F0C96E;background:linear-gradient(180deg,rgba(201,155,82,.03),rgba(201,155,82,.1));}
.tabs a.on::after{left:8%;right:8%;background:linear-gradient(90deg,transparent,#E7B956,transparent);
  box-shadow:0 0 8px rgba(231,185,86,.34);}

/* 工作区 */
.body{position:relative;flex:1 1 auto;min-height:0;display:flex;
  background:
    linear-gradient(rgba(10,8,7,.68),rgba(10,8,7,.78)),
    repeating-linear-gradient(0deg,transparent 0 35px,rgba(232,202,162,.018) 36px);}
.side{width:var(--panel-w);flex-shrink:0;padding:var(--panel-pad-y) var(--panel-pad-x);
  display:flex;flex-direction:column;
  background:
    linear-gradient(145deg,rgba(55,31,17,.68),rgba(18,13,10,.92)),
    repeating-linear-gradient(45deg,transparent 0 7px,rgba(232,202,162,.012) 8px);
  border-right:1px solid #6B4828;box-shadow:inset -14px 0 28px rgba(0,0,0,.18);}
.side-title{position:relative;height:var(--panel-title-h);line-height:var(--panel-title-h);
  margin:0 0 10px;color:var(--gold-bright);font-family:var(--font-serif);
  font-size:var(--panel-title-font);font-weight:500;letter-spacing:.12em;
  border-bottom:1px solid rgba(201,155,82,.25);}
.side-title::after{content:"";position:absolute;left:0;bottom:-1px;width:52px;height:2px;background:var(--gold);}
.grid{display:grid;grid-template-columns:repeat(3,var(--slot));gap:var(--slot-gap);justify-content:center;}
.slot{width:var(--slot);height:var(--slot);position:relative;border:1px solid #725033;
  background:linear-gradient(135deg,rgba(95,62,34,.72),rgba(36,23,15,.82));
  box-shadow:inset 0 0 0 3px rgba(8,6,5,.32),inset 0 0 18px rgba(0,0,0,.34);}
.slot::after{content:"";position:absolute;inset:5px;border:1px solid rgba(232,202,162,.08);}
.list{flex:1;min-width:0;padding:10px 12px 8px;
  background:radial-gradient(circle at 50% 0,rgba(201,155,82,.045),transparent 46%);}
.toolbar{min-height:38px;display:flex;align-items:center;gap:7px;margin-bottom:8px;padding:4px 0 7px;
  background:linear-gradient(180deg,#11100D 70%,rgba(17,16,13,.82));
  border-bottom:1px solid rgba(201,155,82,.22);}
.toolbar input{flex:1;height:28px;border:1px solid #4E3925;border-left:2px solid var(--gold-dim);
  background:#0D0B09;color:var(--text);padding:4px 9px;font-family:var(--font-main);}
.tb{min-width:27px;height:27px;border:1px solid #4E3925;color:var(--muted);
  background:linear-gradient(180deg,#211810,#120E0B);display:flex;align-items:center;justify-content:center;}
.grp{min-height:28px;display:flex;align-items:center;padding:4px 7px;color:#D2A96E;font-size:12px;
  background:linear-gradient(90deg,#332113,rgba(51,33,19,.18));
  border-bottom:1px solid rgba(201,155,82,.24);border-left:2px solid #755030;}
.row{min-height:34px;display:flex;align-items:center;gap:8px;padding:2px 6px;font-size:12px;
  border-bottom:1px solid rgba(201,155,82,.10);background:rgba(10,8,7,.22);}
.row:nth-child(even){background:rgba(255,255,255,.014);}
.row.eq{background:linear-gradient(90deg,rgba(92,52,26,.72),rgba(59,36,18,.25));box-shadow:inset 3px 0 #B98343;}
.row .ic{width:26px;height:26px;border:1px solid #6A4B2D;background:#0C0A08;flex:0 0 auto;}

/* 底栏 */
.foot{position:relative;height:var(--foot-h);display:flex;align-items:center;justify-content:space-between;
  padding:0 16px 0 42px;background:linear-gradient(90deg,#160D09,#080605 50%,#160D09);
  border-top:1px solid #75502E;}
.foot::before{content:"";position:absolute;left:22%;right:22%;top:-1px;height:1px;
  background:linear-gradient(90deg,transparent,#D6A755,transparent);}
.fres{min-height:26px;display:flex;align-items:center;gap:6px;padding:3px 8px;font-size:12px;
  background:rgba(255,255,255,.018);border-left:1px solid rgba(201,155,82,.24);}
.fres em{color:#806A50;font-size:10px;letter-spacing:.08em;font-style:normal;}
.fcenter{position:absolute;left:50%;top:50%;width:120px;transform:translate(-50%,-50%);
  display:flex;align-items:center;gap:7px;color:#775531;font-size:7px;}
.fcenter i{height:1px;flex:1;background:linear-gradient(90deg,transparent,#775531);}
.fcenter i:last-child{background:linear-gradient(90deg,#775531,transparent);}

/* ══ 调参面板 ══════════════════════════════════════════════ */
.cfg{width:430px;border:1px solid #2b2119;border-radius:4px;padding:12px 14px;
  display:flex;flex-direction:column;gap:6px;max-height:760px;overflow:auto;}
.cfg h2{font-size:12px;color:var(--gold);margin:10px 0 2px;font-weight:normal;letter-spacing:.1em;}
.cfg h2:first-child{margin-top:0;}
.r{display:flex;align-items:center;gap:8px;font-size:11.5px;}
.r label{width:112px;color:var(--muted);}
.r input[type=range]{flex:1;min-width:90px;}
.r input[type=color]{width:34px;height:20px;padding:0;border:1px solid #3A2A1C;background:none;}
.r b{width:54px;text-align:right;color:var(--gold);}
textarea{width:100%;height:150px;background:#15110E;border:1px solid #3A2A1C;
  color:var(--text);font:11px/1.5 monospace;padding:7px;resize:vertical;margin-top:8px;}
.hint{font-size:11px;color:#6E5540;line-height:1.6;margin-top:6px;}
</style>

<div>
  <h1>角色卡·改良版调参</h1>
  <div class="sheet">
    <section class="identity">
      <div class="rail"><span class="code">L.C.</span><span class="line"></span><span class="idx">NO.13</span></div>
      <div class="head">
        <div class="col col-l">
          <div class="avatar-row">
            <div class="avatar"></div>
            <div>
              <div class="lv">LV 10</div>
              <div class="xp"><i></i></div>
            </div>
          </div>
          <div class="bar hp"><i></i><b>99 / 99</b></div>
          <div class="bar san"><i></i><b>50 / 95</b></div>
        </div>

        <div class="col col-m">
          <div class="iblock">
            <div class="ilabel">基础信息</div>
            <div class="irow"><span class="ic"></span><span class="v">3</span>
              <span class="ic"></span><span class="v">2</span>
              <span class="ic"></span><span class="v">4-9</span></div>
          </div>
          <div class="iblock">
            <div class="ilabel">抗性信息</div>
            <div class="irow"><span class="ic"></span><span class="v">1.0</span>
              <span class="ic"></span><span class="v">0.5</span>
              <span class="ic"></span><span class="v">2.0</span></div>
          </div>
        </div>

        <div class="col col-r">
          <div class="bg-tag">定事务所 · 收尾人</div>
          <div class="name">哈肯萨</div>
          <div class="attrs">
            <div class="attr"><span class="l">力</span><span class="v">6</span><span class="btn"></span></div>
            <div class="attr"><span class="l">敏</span><span class="v">7</span><span class="btn"></span></div>
            <div class="attr"><span class="l">体</span><span class="v">5</span><span class="btn"></span></div>
            <div class="attr"><span class="l">智</span><span class="v">8</span><span class="btn"></span></div>
            <div class="attr"><span class="l">感</span><span class="v">4</span><span class="btn"></span></div>
            <div class="attr"><span class="l">魅</span><span class="v">3</span><span class="btn"></span></div>
          </div>
        </div>
      </div>
    </section>

    <nav class="tabs">
      <a class="on">◆ 物品</a><a>◆ 技能</a><a>◆ 战斗</a>
    </nav>

    <main class="body">
      <aside class="side">
        <div class="side-title">装备栏</div>
        <div class="grid">
          <div class="slot"></div><div class="slot"></div><div class="slot"></div>
          <div class="slot"></div><div class="slot"></div><div class="slot"></div>
          <div class="slot"></div><div class="slot"></div><div class="slot"></div>
        </div>
      </aside>
      <section class="list">
        <div class="toolbar"><input placeholder="搜索物品…"><span class="tb">★</span>
          <span class="tb">▼</span><span class="tb">▤</span><span class="tb">＋</span></div>
        <div class="grp">▼ 武器（3）</div>
        <div class="row eq"><span class="ic"></span>庄严哀悼·生</div>
        <div class="row"><span class="ic"></span>旅人短刀</div>
        <div class="row"><span class="ic"></span>定制军刀</div>
        <div class="grp">▼ 消耗品（2）</div>
        <div class="row"><span class="ic"></span>止血绷带 ×3</div>
        <div class="row"><span class="ic"></span>镇静剂 ×1</div>
      </section>
    </main>

    <footer class="foot">
      <div class="fres"><em>眼</em> 4949</div>
      <div class="fcenter"><i></i>◆<i></i></div>
      <div style="display:flex;gap:8px;">
        <div class="fres"><em>容量</em> 18 / 40</div>
        <div class="fres"><em>星芒</em> 7 / 11</div>
      </div>
    </footer>
  </div>
</div>

<div class="cfg" id="cfg"></div>

<script>
// [变量名, 中文, 类型, 最小, 最大, 步长, 默认值]  type: n=数值(px) / e=em / c=颜色
const GROUPS = [
  ["色板", [
    ["--gold-bright", "亮金（数值/名字）", "c", 0,0,0, "#E8CAA2"],
    ["--gold",        "主金（描边/强调）", "c", 0,0,0, "#C99B52"],
    ["--gold-dim",    "暗金（分隔线）",     "c", 0,0,0, "#725332"],
    ["--copper",      "铜（左列强调条）",   "c", 0,0,0, "#8E4D2F"],
    ["--text",        "正文",              "c", 0,0,0, "#E8D2AE"],
    ["--muted",       "次要文字",           "c", 0,0,0, "#9B8061"],
  ]],
  ["整体结构", [
    ["--rail-w",     "左侧竖条宽",  "n", 0, 60, 1, 30],
    ["--head-left",  "头部左列宽",  "n", 180, 360, 1, 260],
    ["--head-mid",   "头部中列宽",  "n", 140, 340, 1, 220],
    ["--head-gap",   "三列间距",    "n", 0, 30, 1, 10],
    ["--head-minh",  "头部最小高",  "n", 140, 320, 1, 216],
    ["--head-pad-y", "头部上下留白","n", 0, 30, 1, 10],
    ["--head-pad-x", "头部左右留白","n", 0, 30, 1, 12],
    ["--col-pad",    "列内边距",    "n", 0, 24, 1, 8],
    ["--col-gap",    "列内行距",    "n", 0, 20, 1, 5],
    ["--col-accent", "列强调条宽",  "n", 0, 8, 1, 2],
  ]],
  ["头部元素", [
    ["--avatar",       "头像尺寸",     "n", 60, 160, 1, 100],
    ["--bar-w",        "资源条宽",     "n", 120, 260, 1, 190],
    ["--bar-h",        "资源条高",     "n", 14, 44, 1, 28],
    ["--infolabel-h",  "信息标题高",   "n", 16, 44, 1, 26],
    ["--infolabel-mb", "标题下间距",   "n", 0, 20, 1, 6],
    ["--inforow-h",    "信息行高",     "n", 30, 80, 1, 52],
    ["--info-icon",    "信息图标",     "n", 16, 44, 1, 28],
    ["--info-font",    "信息数值字号", "n", 12, 34, 1, 22],
    ["--name-font",    "角色名字号",   "n", 18, 44, 1, 30],
    ["--attr-h",       "属性格高",     "n", 44, 100, 1, 68],
    ["--attr-gap",     "属性格间距",   "n", 0, 20, 1, 5],
    ["--attr-label",   "属性名字号",   "n", 9, 22, 1, 13],
    ["--attr-value",   "属性值字号",   "n", 12, 30, 1, 18],
  ]],
  ["导航 / 工作区 / 底栏", [
    ["--tab-h",           "Tab 高",       "n", 24, 60, 1, 38],
    ["--tab-font",        "Tab 字号",     "n", 10, 20, 1, 13],
    ["--tab-track",       "Tab 字距",     "e", 0, 40, 1, 16],
    ["--tab-bar",         "选中条粗细",   "n", 1, 6, 1, 2],
    ["--panel-w",         "左栏宽",       "n", 180, 400, 1, 275],
    ["--panel-pad-y",     "左栏上下留白", "n", 0, 30, 1, 10],
    ["--panel-pad-x",     "左栏左右留白", "n", 0, 30, 1, 12],
    ["--panel-title-h",   "左栏标题高",   "n", 24, 70, 1, 45],
    ["--panel-title-font","左栏标题字号", "n", 12, 30, 1, 20],
    ["--slot",            "装备格边长",   "n", 44, 100, 1, 70],
    ["--slot-gap",        "装备格间距",   "n", 0, 26, 1, 10],
    ["--foot-h",          "底栏高",       "n", 24, 70, 1, 40],
  ]],
];

const $ = id => document.getElementById(id);
const all = GROUPS.flatMap(([, list]) => list);
const idOf = v => "p" + v.replace(/-/g, "_");

$("cfg").innerHTML = GROUPS.map(([title, list]) => `<h2>${title}</h2>` + list.map(
  ([v, label, type, min, max, step, def]) => `<div class="r"><label>${label}</label>` + (
    type === "c"
      ? `<input type="color" id="${idOf(v)}" value="${def}"><b id="${idOf(v)}n">${def}</b>`
      : `<input type="range" id="${idOf(v)}" min="${min}" max="${max}" step="${step}" value="${def}">`
        + `<b id="${idOf(v)}n"></b>`
  ) + `</div>`).join("")).join("")
  + `<textarea id="out" readonly></textarea>`
  + `<div class="hint">导出的是一段覆盖用 CSS：贴到
     <code>styles/character-sheet-redesign.css</code> 末尾即可（同名规则后写的生效）。
     字距按 em 计（滑块值 ÷ 100）。</div>`;

function valOf(v, type) {
  const raw = $(idOf(v)).value;
  if (type === "c") return raw;
  if (type === "e") return (Number(raw) / 100).toFixed(2) + "em";
  return Number(raw) + "px";
}

function apply() {
  const rs = document.documentElement.style;
  for (const [v, , type] of all) {
    const val = valOf(v, type);
    rs.setProperty(v, val);
    $(idOf(v) + "n").textContent = val;
  }
  dump();
}

function dump() {
  const g = v => valOf(v, all.find(a => a[0] === v)[2]);
  const S = ".limbuscompany.actor.character-sheet-redesign";
  $("out").value =
`/* ── 调参台导出：贴到 character-sheet-redesign.css 末尾 ── */
${S} {
  --redesign-gold-bright: ${g("--gold-bright")};
  --redesign-gold: ${g("--gold")};
  --redesign-gold-dim: ${g("--gold-dim")};
  --redesign-copper: ${g("--copper")};
  --redesign-text: ${g("--text")};
  --redesign-muted: ${g("--muted")};
}
${S} .redesign-identity { padding-left: ${g("--rail-w")}; }
${S} .redesign-identity-rail { width: ${g("--rail-w")}; }
${S} .sheet-header {
  grid-template-columns: ${g("--head-left")} ${g("--head-mid")} minmax(0, 1fr);
  gap: ${g("--head-gap")}; min-height: ${g("--head-minh")};
  padding: ${g("--head-pad-y")} ${g("--head-pad-x")} 9px;
}
${S} .header-col { padding: ${g("--col-pad")}; gap: ${g("--col-gap")}; }
${S} .header-left  { border-left-width: ${g("--col-accent")}; }
${S} .header-mid   { border-left-width: ${g("--col-accent")}; padding: ${g("--col-pad")}; }
${S} .header-right { border-left-width: ${g("--col-accent")}; }
${S} .actor-avatar { width: ${g("--avatar")}; height: ${g("--avatar")}; }
${S} .resource-bar-wrap { width: ${g("--bar-w")}; height: ${g("--bar-h")}; }
${S} .info-block-label { height: ${g("--infolabel-h")}; line-height: ${g("--infolabel-h")}; margin-bottom: ${g("--infolabel-mb")}; }
${S} .info-row { height: ${g("--inforow-h")}; }
${S} .info-icon, ${S} .resist-icon { width: ${g("--info-icon")}; height: ${g("--info-icon")}; }
${S} .info-sign, ${S} .info-val, ${S} .resist-val { font-size: ${g("--info-font")}; }
${S} .actor-name-display, ${S} .actor-name-input { font-size: ${g("--name-font")}; }
${S} .attributes-block { gap: ${g("--attr-gap")}; }
${S} .attr-item { height: ${g("--attr-h")}; }
${S} .attr-label { font-size: ${g("--attr-label")}; }
${S} .attr-value { font-size: ${g("--attr-value")}; }
${S} .sheet-tabs.redesign-tabs { height: ${g("--tab-h")}; padding: 0 ${g("--rail-w")}; }
${S} .sheet-tabs.redesign-tabs .item { height: ${g("--tab-h")}; font-size: ${g("--tab-font")}; letter-spacing: ${g("--tab-track")}; }
${S} .sheet-tabs.redesign-tabs .item::after { height: ${g("--tab-bar")}; }
${S} .equip-panel, ${S} .skill-panel, ${S} .combat-status-panel {
  width: ${g("--panel-w")}; padding: ${g("--panel-pad-y")} ${g("--panel-pad-x")};
}
${S} .equip-panel-label, ${S} .skill-panel-label, ${S} .combat-status-title {
  height: ${g("--panel-title-h")}; line-height: ${g("--panel-title-h")}; font-size: ${g("--panel-title-font")};
}
${S} .equip-grid { grid-template-columns: repeat(3, ${g("--slot")}); gap: ${g("--slot-gap")}; }
${S} .equip-slot { width: ${g("--slot")}; height: ${g("--slot")}; }
${S} .redesign-footer { height: ${g("--foot-h")}; }`;
}

for (const [v] of all) $(idOf(v)).addEventListener("input", apply);
document.querySelectorAll(".tabs a").forEach(a => a.addEventListener("click", () => {
  document.querySelectorAll(".tabs a").forEach(x => x.classList.remove("on"));
  a.classList.add("on");
}));
apply();
</script>
