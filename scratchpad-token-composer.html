<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>装备合成 Token 调试台</title>
<style>
  :root{
    --bg:#14161c; --panel:#1c1f28; --line:#2e3340; --txt:#d8dbe4;
    --dim:#8b93a6; --gold:#c9a227; --hot:#e0553f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:13px/1.5 "Segoe UI","Microsoft YaHei",sans-serif;
       display:flex;height:100vh;overflow:hidden}

  /* ── 左：画布 ───────────────────────────────── */
  #stage{flex:1;display:flex;flex-direction:column;align-items:center;
         justify-content:center;gap:12px;padding:16px;min-width:0}
  #canvasWrap{position:relative;border:1px solid var(--line);
              box-shadow:0 0 0 1px #000, 0 8px 30px #0008}
  #view{display:block;cursor:grab;touch-action:none}
  #view.dragging{cursor:grabbing}
  #hint{color:var(--dim);font-size:12px;text-align:center}
  #hint b{color:var(--gold);font-weight:600}
  #dropMask{position:absolute;inset:0;display:none;align-items:center;
            justify-content:center;background:#c9a22722;
            border:2px dashed var(--gold);color:var(--gold);font-size:16px;
            pointer-events:none}
  #dropMask.on{display:flex}

  /* ── 右：控制面板 ───────────────────────────── */
  #panel{width:346px;flex:none;background:var(--panel);
         border-left:1px solid var(--line);overflow-y:auto;padding:12px}
  h3{margin:16px 0 8px;font-size:12px;letter-spacing:.12em;color:var(--gold);
     border-bottom:1px solid var(--line);padding-bottom:5px;text-transform:uppercase}
  h3:first-child{margin-top:0}

  .row{display:flex;align-items:center;gap:8px;margin:5px 0}
  .row label{flex:none;width:76px;color:var(--dim);font-size:12px}
  .row input[type=range]{flex:1;min-width:0;accent-color:var(--gold)}
  .row output{flex:none;width:52px;text-align:right;
              font-family:ui-monospace,Consolas,monospace;font-size:12px}

  button{background:#262b36;color:var(--txt);border:1px solid var(--line);
         border-radius:3px;padding:5px 9px;cursor:pointer;font-size:12px}
  button:hover{border-color:var(--gold);color:#fff}
  button.on{background:var(--gold);color:#1b1b1b;border-color:var(--gold)}
  .btns{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}

  /* 图层列表 */
  #layers{display:flex;flex-direction:column;gap:3px}
  .lyr{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:3px;
       background:#232833;border:1px solid transparent;cursor:pointer}
  .lyr.sel{border-color:var(--gold);background:#2c3140}
  .lyr img{width:26px;height:26px;object-fit:contain;flex:none;
           background:repeating-conic-gradient(#333 0 25%,#3d3d3d 0 50%) 50%/8px 8px}
  .lyr .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
           white-space:nowrap;font-size:12px}
  .lyr .zt{flex:none;color:var(--dim);font-size:11px;
           font-family:ui-monospace,monospace}
  .lyr .x{flex:none;color:var(--dim);padding:0 3px}
  .lyr .x:hover{color:var(--hot)}
  .lyr.head .nm{color:var(--gold)}

  select{background:#262b36;color:var(--txt);border:1px solid var(--line);
         border-radius:3px;padding:4px;font-size:12px;flex:1;min-width:0}
  textarea{width:100%;height:150px;background:#12141a;color:#9fd3a0;
           border:1px solid var(--line);border-radius:3px;padding:6px;
           font-family:ui-monospace,Consolas,monospace;font-size:11px;resize:vertical}
  .note{color:var(--dim);font-size:11px;margin:6px 0;line-height:1.6}
  .empty{color:var(--dim);font-size:12px;padding:6px 0}
</style>
</head>
<body>

<div id="stage">
  <div id="canvasWrap">
    <canvas id="view" width="512" height="512"></canvas>
    <div id="dropMask">拖入 256×256 透明素材</div>
  </div>
  <div id="hint">
    画布上 <b>拖拽</b> 移动选中图层 ·
    <b>滚轮</b> 缩放 · <b>Shift+滚轮</b> 旋转 ·
    <b>方向键</b> 微调 · <b>Del</b> 删除
  </div>
</div>

<div id="panel">

  <h3>角色骨架 (RIG)</h3>
  <div class="row">
    <label>预设体型</label>
    <select id="rigPreset"></select>
  </div>
  <div class="row"><label>头部 X</label><input type="range" id="rigX"  min="0"   max="256" step="1"><output id="rigXo"></output></div>
  <div class="row"><label>头部 Y</label><input type="range" id="rigY"  min="0"   max="256" step="1"><output id="rigYo"></output></div>
  <div class="row"><label>头部宽</label><input type="range" id="rigW"  min="16"  max="256" step="1"><output id="rigWo"></output></div>
  <div class="row"><label>头部旋转</label><input type="range" id="rigR" min="-180" max="180" step="1"><output id="rigRo"></output></div>
  <div class="note">
    装备的位置全部按「相对头部中心、以头宽为单位」存储。<br>
    改这四个值 = 换一个角色 —— 所有装备应当整体跟随。
  </div>

  <h3>图层</h3>
  <div class="btns">
    <button id="addHead">＋ 头部</button>
    <button id="addEquip">＋ 装备</button>
    <button id="loadSample">载入示例</button>
  </div>
  <div id="layers"></div>
  <input type="file" id="filePick" accept="image/*" multiple hidden>

  <h3>选中图层</h3>
  <div id="lyrCtl">
    <div class="row"><label>子类型</label><select id="subtype"></select></div>
    <div class="row"><label>偏移 X</label><input type="range" id="lx"  min="-2"  max="2"   step="0.005"><output id="lxo"></output></div>
    <div class="row"><label>偏移 Y</label><input type="range" id="ly"  min="-2"  max="2"   step="0.005"><output id="lyo"></output></div>
    <div class="row"><label>缩放</label>  <input type="range" id="ls"  min="0.05" max="4"  step="0.005"><output id="lso"></output></div>
    <div class="row"><label>旋转</label>  <input type="range" id="lr"  min="-180" max="180" step="1"><output id="lro"></output></div>
    <div class="row"><label>层级 Z</label><input type="range" id="lz"  min="-50" max="100" step="1"><output id="lzo"></output></div>
    <div class="row"><label>不透明</label><input type="range" id="lo"  min="0"   max="1"   step="0.01"><output id="loo"></output></div>
    <div class="btns">
      <button id="flipX">水平翻转</button>
      <button id="reset1">重置变换</button>
    </div>
  </div>

  <h3>显示</h3>
  <div class="btns">
    <button id="tGrid" class="on">网格</button>
    <button id="tRing" class="on">Token 圆</button>
    <button id="tAnchor" class="on">锚点</button>
    <button id="tChecker" class="on">透明格</button>
  </div>

  <h3>输出</h3>
  <div class="row">
    <label>导出倍率</label>
    <select id="expScale">
      <option value="1">256 (1x)</option>
      <option value="2" selected>512 (2x)</option>
      <option value="4">1024 (4x)</option>
    </select>
  </div>
  <div class="btns">
    <button id="expPng">导出 PNG</button>
    <button id="expJson">刷新 JSON</button>
    <button id="impJson">导入 JSON</button>
  </div>
  <textarea id="json" spellcheck="false"></textarea>
  <div class="note">
    这段 JSON 的字段就是将来 <code>EquipmentData.tokenLayer</code> 与
    <code>CharacterData.tokenRig</code> 的形状。
  </div>

</div>

<script>
/* ══════════════════════════════════════════════════════════════
   装备合成 Token —— 参数调试台
   基准画布 BASE=256（与素材同尺寸），显示放大 2 倍。
   坐标约定：
     rig  = { x, y, w, rot }  头部中心与头宽，单位 = 基准画布像素
     图层 = { x, y, scale, rot, z, flipX, opacity }
            x/y    相对头部中心的偏移，单位 = 头宽（rig.w）
            scale  绘制宽度 / 头宽
            rot    相对头部旋转的角度（度）
   因此更换 rig（=换角色）时，所有装备自动跟随缩放/平移/旋转。
   ══════════════════════════════════════════════════════════════ */

const BASE = 256;                 // 基准画布边长
const VIEW = 512;                 // 屏幕显示边长
const K    = VIEW / BASE;         // 显示放大倍率

/* 子类型 → 默认层级。披风一类要给负值，所以 Z 可单独覆盖。*/
const SUBTYPES = {
  cape:      { label: "披风/背后", z: -10 },
  lower:     { label: "下装",      z:  10 },
  upper:     { label: "上装",      z:  20 },
  head:      { label: "头部",      z:  30 },
  accessory: { label: "饰品",      z:  40 },
  weapon:    { label: "武器",      z:  50 },
};

/* 预设体型：用来验证「同一套装备换到别的角色身上」是否自动到位 */
const RIG_PRESETS = {
  "标准 PL":   { x: 128, y: 104, w: 96,  rot: 0 },
  "大头矮个":  { x: 128, y:  88, w: 124, rot: 0 },
  "小头高个":  { x: 128, y:  76, w: 72,  rot: 0 },
  "侧身歪头":  { x: 112, y: 100, w: 96,  rot: -14 },
};

/* ── 状态 ─────────────────────────────────────── */
const state = {
  rig: { ...RIG_PRESETS["标准 PL"] },
  layers: [],        // { id, name, img, subtype, x, y, scale, rot, z, flipX, opacity }
  selId: null,
  show: { grid: true, ring: true, anchor: true, checker: true },
};
let _uid = 0;

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const D2R = Math.PI / 180;

/* ── 图层工厂 ─────────────────────────────────── */
function makeLayer(name, img, subtype = "weapon") {
  return {
    id: ++_uid, name, img, subtype,
    x: 0, y: 0, scale: 1, rot: 0,
    z: SUBTYPES[subtype].z,
    flipX: false, opacity: 1,
  };
}
const headLayer  = () => state.layers.find(l => l.subtype === "head");
const selLayer   = () => state.layers.find(l => l.id === state.selId) ?? null;
const sortedLyrs = () => [...state.layers].sort((a, b) => a.z - b.z);

/* ── 变换：归一化参数 → 基准画布世界值 ─────────── */
function worldOf(l) {
  const r = state.rig;
  if (l.subtype === "head") {
    return { cx: r.x, cy: r.y, w: r.w * l.scale, rot: r.rot + l.rot };
  }
  const a  = r.rot * D2R;
  const dx = l.x * r.w, dy = l.y * r.w;
  return {
    cx : r.x + dx * Math.cos(a) - dy * Math.sin(a),
    cy : r.y + dx * Math.sin(a) + dy * Math.cos(a),
    w  : l.scale * r.w,
    rot: r.rot + l.rot,
  };
}

/* ── 绘制 ─────────────────────────────────────── */
function drawLayers(ctx, scale) {
  for (const l of sortedLyrs()) {
    if (!l.img || !l.img.complete || !l.img.naturalWidth) continue;
    const w  = worldOf(l);
    const iw = l.img.naturalWidth, ih = l.img.naturalHeight;
    const dw = w.w * scale;
    const dh = dw * (ih / iw);
    ctx.save();
    ctx.globalAlpha = l.opacity;
    ctx.translate(w.cx * scale, w.cy * scale);
    ctx.rotate(w.rot * D2R);
    if (l.flipX) ctx.scale(-1, 1);
    ctx.drawImage(l.img, -dw / 2, -dh / 2, dw, dh);
    ctx.restore();
  }
}

function render() {
  const cv  = $("view");
  const ctx = cv.getContext("2d");
  ctx.clearRect(0, 0, VIEW, VIEW);

  // 透明棋盘格
  if (state.show.checker) {
    const s = 16;
    for (let y = 0; y < VIEW; y += s) for (let x = 0; x < VIEW; x += s) {
      ctx.fillStyle = ((x / s + y / s) & 1) ? "#22252c" : "#1a1d23";
      ctx.fillRect(x, y, s, s);
    }
  }

  // 网格（基准画布每 32px 一格）
  if (state.show.grid) {
    ctx.strokeStyle = "#ffffff12"; ctx.lineWidth = 1;
    for (let i = 32; i < BASE; i += 32) {
      ctx.beginPath();
      ctx.moveTo(i * K + .5, 0); ctx.lineTo(i * K + .5, VIEW);
      ctx.moveTo(0, i * K + .5); ctx.lineTo(VIEW, i * K + .5);
      ctx.stroke();
    }
    ctx.strokeStyle = "#ffffff28";
    ctx.beginPath();
    ctx.moveTo(VIEW / 2 + .5, 0); ctx.lineTo(VIEW / 2 + .5, VIEW);
    ctx.moveTo(0, VIEW / 2 + .5); ctx.lineTo(VIEW, VIEW / 2 + .5);
    ctx.stroke();
  }

  drawLayers(ctx, K);

  // Token 外接圆（Foundry 里 token 图是方的，但视觉上按圆判读）
  if (state.show.ring) {
    ctx.strokeStyle = "#c9a22770"; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(VIEW / 2, VIEW / 2, VIEW / 2 - 1, 0, Math.PI * 2);
    ctx.stroke();
  }

  // 头部锚点
  if (state.show.anchor) {
    const r = state.rig;
    ctx.save();
    ctx.translate(r.x * K, r.y * K);
    ctx.rotate(r.rot * D2R);
    ctx.strokeStyle = "#e0553faa"; ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.strokeRect(-r.w * K / 2, -r.w * K / 2, r.w * K, r.w * K);
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(-7, 0); ctx.lineTo(7, 0);
    ctx.moveTo(0, -7); ctx.lineTo(0, 7);
    ctx.stroke();
    ctx.restore();
  }

  // 选中图层高亮框
  const s = selLayer();
  if (s && s.img && s.img.naturalWidth) {
    const w  = worldOf(s);
    const dw = w.w * K, dh = dw * (s.img.naturalHeight / s.img.naturalWidth);
    ctx.save();
    ctx.translate(w.cx * K, w.cy * K);
    ctx.rotate(w.rot * D2R);
    ctx.strokeStyle = "#c9a227"; ctx.lineWidth = 1;
    ctx.strokeRect(-dw / 2, -dh / 2, dw, dh);
    ctx.restore();
  }
}

/* ── 面板同步 ─────────────────────────────────── */
function syncPanel() {
  const r = state.rig;
  $("rigX").value = r.x;   $("rigXo").textContent = r.x;
  $("rigY").value = r.y;   $("rigYo").textContent = r.y;
  $("rigW").value = r.w;   $("rigWo").textContent = r.w;
  $("rigR").value = r.rot; $("rigRo").textContent = r.rot + "°";

  const l = selLayer();
  $("lyrCtl").style.opacity = l ? "1" : ".35";
  for (const id of ["subtype","lx","ly","ls","lr","lz","lo","flipX","reset1"])
    $(id).disabled = !l;
  if (!l) return;

  const isHead = l.subtype === "head";
  $("lx").disabled = $("ly").disabled = isHead;   // 头部位置由 rig 决定
  $("subtype").value = l.subtype;
  $("lx").value = l.x;       $("lxo").textContent = l.x.toFixed(3);
  $("ly").value = l.y;       $("lyo").textContent = l.y.toFixed(3);
  $("ls").value = l.scale;   $("lso").textContent = l.scale.toFixed(3);
  $("lr").value = l.rot;     $("lro").textContent = l.rot + "°";
  $("lz").value = l.z;       $("lzo").textContent = l.z;
  $("lo").value = l.opacity; $("loo").textContent = l.opacity.toFixed(2);
  $("flipX").classList.toggle("on", l.flipX);
}

function syncLayerList() {
  const box = $("layers");
  box.textContent = "";
  if (!state.layers.length) {
    const d = document.createElement("div");
    d.className = "empty";
    d.textContent = "还没有图层 —— 点「载入示例」或直接把图拖进画布。";
    box.appendChild(d);
    return;
  }
  for (const l of [...state.layers].sort((a, b) => b.z - a.z)) {
    const row = document.createElement("div");
    row.className = "lyr" + (l.id === state.selId ? " sel" : "")
                  + (l.subtype === "head" ? " head" : "");
    row.onclick = () => { state.selId = l.id; syncLayerList(); syncPanel(); render(); };

    const im = document.createElement("img");
    if (l.img?.src) im.src = l.img.src;
    const nm = document.createElement("div");
    nm.className = "nm"; nm.textContent = l.name; nm.title = l.name;
    const zt = document.createElement("div");
    zt.className = "zt"; zt.textContent = "z" + l.z;
    const x  = document.createElement("div");
    x.className = "x"; x.textContent = "✕";
    x.onclick = ev => {
      ev.stopPropagation();
      state.layers = state.layers.filter(v => v.id !== l.id);
      if (state.selId === l.id) state.selId = state.layers.at(-1)?.id ?? null;
      syncLayerList(); syncPanel(); render();
    };
    row.append(im, nm, zt, x);
    box.appendChild(row);
  }
}

const refresh = () => { syncLayerList(); syncPanel(); render(); };

/* ── 图片载入 ─────────────────────────────────── */
function addImage(src, name, subtype) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const l = makeLayer(name, img, subtype);
      if (subtype === "head") {
        // 同一时刻只保留一个头部图层
        state.layers = state.layers.filter(v => v.subtype !== "head");
      }
      state.layers.push(l);
      state.selId = l.id;
      refresh();
      res(l);
    };
    img.onerror = () => { console.warn("载入失败:", src); res(null); };
    img.src = src;
  });
}

function pickFiles(subtype) {
  const inp = $("filePick");
  inp.onchange = async () => {
    for (const f of inp.files) {
      const url = URL.createObjectURL(f);
      await addImage(url, f.name.replace(/\.\w+$/, ""), subtype);
      if (subtype === "head") break;
    }
    inp.value = "";
  };
  inp.click();
}

/* 占位头部：没有素材时也能立刻试手感 */
function placeholderHead() {
  const c = document.createElement("canvas");
  c.width = c.height = 256;
  const g = c.getContext("2d");
  g.fillStyle = "#d9b48f";
  g.beginPath(); g.ellipse(128, 132, 74, 88, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = "#3a2c25";
  g.beginPath(); g.ellipse(128, 74, 78, 52, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = "#2b2b2b";
  g.beginPath(); g.ellipse(100, 140, 9, 12, 0, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.ellipse(156, 140, 9, 12, 0, 0, Math.PI * 2); g.fill();
  g.strokeStyle = "#00000055"; g.lineWidth = 3;
  g.beginPath(); g.moveTo(112, 186); g.quadraticCurveTo(128, 196, 144, 186); g.stroke();
  return c.toDataURL();
}

/* 载入仓库里的真实素材（需通过 http 打开本文件；file:// 下可能失败） */
const SAMPLES = [
  { src: "assets/equipment/拇指-礼帽.webp",  name: "拇指-礼帽",  subtype: "accessory" },
  { src: "assets/equipment/拇指-西装.webp",  name: "拇指-西装",  subtype: "upper" },
  { src: "assets/equipment/四协会-匕首.webp", name: "四协会-匕首", subtype: "weapon" },
];

async function loadSample() {
  state.layers = [];
  await addImage(placeholderHead(), "占位头部", "head");
  let ok = 0;
  for (const s of SAMPLES) if (await addImage(s.src, s.name, s.subtype)) ok++;
  if (!ok) {
    $("hint").innerHTML =
      "仓库素材没读到（<b>file:// 打开时会被浏览器拦</b>）—— " +
      "在仓库根目录跑 <b>python3 -m http.server</b> 再访问本页，或直接把图拖进画布。";
  }
  // 给示例一个像样的初始摆位，方便一眼看出「跟随头部」的效果
  const put = (nm, x, y, sc, z) => {
    const l = state.layers.find(v => v.name === nm);
    if (l) Object.assign(l, { x, y, scale: sc, ...(z != null ? { z } : {}) });
  };
  put("拇指-礼帽",  0,     -0.55, 1.35);
  put("拇指-西装",  0,      1.05, 1.90);
  put("四协会-匕首", 0.95,  0.85, 0.95);
  refresh();
}

/* ── 画布交互 ─────────────────────────────────── */
(function bindCanvas() {
  const cv = $("view");
  let drag = null;

  const toBase = ev => {
    const r = cv.getBoundingClientRect();
    return {
      x: (ev.clientX - r.left) * (VIEW / r.width)  / K,
      y: (ev.clientY - r.top)  * (VIEW / r.height) / K,
    };
  };

  /* 命中测试：从最上层往下找 */
  function hit(p) {
    for (const l of sortedLyrs().reverse()) {
      if (!l.img?.naturalWidth) continue;
      const w  = worldOf(l);
      const dw = w.w, dh = dw * (l.img.naturalHeight / l.img.naturalWidth);
      const a  = -w.rot * D2R;
      const dx = p.x - w.cx, dy = p.y - w.cy;
      const lx = dx * Math.cos(a) - dy * Math.sin(a);
      const ly = dx * Math.sin(a) + dy * Math.cos(a);
      if (Math.abs(lx) <= dw / 2 && Math.abs(ly) <= dh / 2) return l;
    }
    return null;
  }

  cv.addEventListener("pointerdown", ev => {
    const p = toBase(ev);
    const l = hit(p);
    if (l) { state.selId = l.id; syncLayerList(); syncPanel(); }
    const s = selLayer();
    if (!s) { render(); return; }
    cv.setPointerCapture(ev.pointerId);
    cv.classList.add("dragging");
    drag = { p, l: s, ox: s.x, oy: s.y, rx: state.rig.x, ry: state.rig.y };
    render();
  });

  cv.addEventListener("pointermove", ev => {
    if (!drag) return;
    const p = toBase(ev);
    const dx = p.x - drag.p.x, dy = p.y - drag.p.y;
    if (drag.l.subtype === "head") {
      // 拖头部 = 移动整个骨架锚点，装备原地跟随
      state.rig.x = clamp(Math.round(drag.rx + dx), 0, BASE);
      state.rig.y = clamp(Math.round(drag.ry + dy), 0, BASE);
    } else {
      const a = -state.rig.rot * D2R, w = state.rig.w;
      drag.l.x = clamp(drag.ox + (dx * Math.cos(a) - dy * Math.sin(a)) / w, -2, 2);
      drag.l.y = clamp(drag.oy + (dx * Math.sin(a) + dy * Math.cos(a)) / w, -2, 2);
    }
    syncPanel(); render();
  });

  const endDrag = () => { drag = null; cv.classList.remove("dragging"); };
  cv.addEventListener("pointerup", endDrag);
  cv.addEventListener("pointercancel", endDrag);

  cv.addEventListener("wheel", ev => {
    const l = selLayer(); if (!l) return;
    ev.preventDefault();
    const step = ev.deltaY < 0 ? 1 : -1;
    if (ev.shiftKey) l.rot = clamp(l.rot + step * 3, -180, 180);
    else             l.scale = clamp(+(l.scale * (step > 0 ? 1.04 : 1 / 1.04)).toFixed(4), 0.05, 4);
    syncPanel(); render();
  }, { passive: false });

  window.addEventListener("keydown", ev => {
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName)) return;
    const l = selLayer(); if (!l) return;
    const d = ev.shiftKey ? 0.05 : 1 / state.rig.w;   // 默认按 1 基准像素走
    if (ev.key === "ArrowLeft")  l.x -= d;
    else if (ev.key === "ArrowRight") l.x += d;
    else if (ev.key === "ArrowUp")    l.y -= d;
    else if (ev.key === "ArrowDown")  l.y += d;
    else if (ev.key === "Delete" || ev.key === "Backspace") {
      state.layers = state.layers.filter(v => v.id !== l.id);
      state.selId = state.layers.at(-1)?.id ?? null;
      refresh(); ev.preventDefault(); return;
    } else return;
    ev.preventDefault();
    l.x = clamp(l.x, -2, 2); l.y = clamp(l.y, -2, 2);
    syncPanel(); render();
  });

  /* 拖放素材 */
  const mask = $("dropMask");
  const wrap = $("canvasWrap");
  wrap.addEventListener("dragover", ev => { ev.preventDefault(); mask.classList.add("on"); });
  wrap.addEventListener("dragleave", () => mask.classList.remove("on"));
  wrap.addEventListener("drop", async ev => {
    ev.preventDefault(); mask.classList.remove("on");
    for (const f of ev.dataTransfer.files) {
      if (!f.type.startsWith("image/")) continue;
      const sub = headLayer() ? "weapon" : "head";
      await addImage(URL.createObjectURL(f), f.name.replace(/\.\w+$/, ""), sub);
    }
  });
})();

/* ── 控件绑定 ─────────────────────────────────── */
(function bindPanel() {
  // 体型预设
  const sel = $("rigPreset");
  for (const k of Object.keys(RIG_PRESETS)) {
    const o = document.createElement("option"); o.value = o.textContent = k;
    sel.appendChild(o);
  }
  sel.onchange = () => { state.rig = { ...RIG_PRESETS[sel.value] }; syncPanel(); render(); };

  const bindRig = (id, key, unit = "") => {
    $(id).oninput = e => {
      state.rig[key] = +e.target.value;
      $(id + "o").textContent = e.target.value + unit;
      render();
    };
  };
  bindRig("rigX", "x"); bindRig("rigY", "y");
  bindRig("rigW", "w"); bindRig("rigR", "rot", "°");

  // 子类型
  const st = $("subtype");
  for (const [k, v] of Object.entries(SUBTYPES)) {
    const o = document.createElement("option");
    o.value = k; o.textContent = `${v.label} (z${v.z})`;
    st.appendChild(o);
  }
  st.onchange = () => {
    const l = selLayer(); if (!l) return;
    if (st.value === "head") state.layers.forEach(v => {
      if (v !== l && v.subtype === "head") v.subtype = "accessory";
    });
    l.subtype = st.value;
    l.z = SUBTYPES[st.value].z;
    refresh();
  };

  const bindLyr = (id, key, fmt) => {
    $(id).oninput = e => {
      const l = selLayer(); if (!l) return;
      l[key] = +e.target.value;
      $(id + "o").textContent = fmt(l[key]);
      if (key === "z") syncLayerList();
      render();
    };
  };
  bindLyr("lx", "x",       v => v.toFixed(3));
  bindLyr("ly", "y",       v => v.toFixed(3));
  bindLyr("ls", "scale",   v => v.toFixed(3));
  bindLyr("lr", "rot",     v => v + "°");
  bindLyr("lz", "z",       v => String(v));
  bindLyr("lo", "opacity", v => v.toFixed(2));

  $("flipX").onclick = () => {
    const l = selLayer(); if (!l) return;
    l.flipX = !l.flipX; syncPanel(); render();
  };
  $("reset1").onclick = () => {
    const l = selLayer(); if (!l) return;
    Object.assign(l, { x: 0, y: 0, scale: 1, rot: 0, opacity: 1, flipX: false });
    syncPanel(); render();
  };

  $("addHead").onclick  = () => pickFiles("head");
  $("addEquip").onclick = () => pickFiles("weapon");
  $("loadSample").onclick = loadSample;

  const tog = (id, key) => {
    $(id).onclick = () => {
      state.show[key] = !state.show[key];
      $(id).classList.toggle("on", state.show[key]);
      render();
    };
  };
  tog("tGrid", "grid"); tog("tRing", "ring");
  tog("tAnchor", "anchor"); tog("tChecker", "checker");

  $("expJson").onclick = dumpJson;
  $("impJson").onclick = loadJson;
  $("expPng").onclick  = exportPng;
})();

/* ── 导出 / 导入 ──────────────────────────────── */
function dumpJson() {
  const out = {
    base: BASE,
    tokenRig: { ...state.rig },                 // → CharacterData.tokenRig
    layers: sortedLyrs().map(l => ({            // → EquipmentData.tokenLayer
      name: l.name,
      subtype: l.subtype,
      x: +l.x.toFixed(4), y: +l.y.toFixed(4),
      scale: +l.scale.toFixed(4), rot: l.rot,
      z: l.z, flipX: l.flipX, opacity: +l.opacity.toFixed(2),
    })),
  };
  $("json").value = JSON.stringify(out, null, 2);
}

function loadJson() {
  let data;
  try { data = JSON.parse($("json").value); }
  catch (e) { alert("JSON 解析失败：" + e.message); return; }
  if (data.tokenRig) state.rig = { ...state.rig, ...data.tokenRig };
  for (const src of data.layers ?? []) {
    const l = state.layers.find(v => v.name === src.name);
    if (l) Object.assign(l, {
      subtype: src.subtype ?? l.subtype,
      x: src.x ?? 0, y: src.y ?? 0,
      scale: src.scale ?? 1, rot: src.rot ?? 0,
      z: src.z ?? l.z, flipX: !!src.flipX,
      opacity: src.opacity ?? 1,
    });
  }
  refresh();
}

/* 这一步就是将来 Foundry 里「合成 → 上传 → 写回 prototypeToken」的前半段 */
function exportPng() {
  const mul = +$("expScale").value;
  const c = document.createElement("canvas");
  c.width = c.height = BASE * mul;
  drawLayers(c.getContext("2d"), mul);
  let url;
  try { url = c.toDataURL("image/png"); }
  catch (e) {
    alert("画布被跨域素材污染，无法导出。\n用 python3 -m http.server 起服务后再打开本页即可。");
    return;
  }
  const a = document.createElement("a");
  a.href = url; a.download = `token_${BASE * mul}.png`; a.click();
}

/* ── 启动 ─────────────────────────────────────── */
loadSample().then(dumpJson);
</script>
