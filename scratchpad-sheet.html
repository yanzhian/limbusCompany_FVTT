<!doctype html>
<meta charset="utf-8">
<title>角色卡·现版调参</title>
<style>
/* ══════════════════════════════════════════════════════════════
   预览区 = 现在这张角色卡的复刻（character-sheet.hbs + §3 CSS），
   所有可调项走 CSS 变量 → 右侧面板实时改 → 底部导出覆盖用 CSS。
   保持现有的简约棕金调，只在留白 / 层级 / 对齐上打磨。
   ══════════════════════════════════════════════════════════════ */
:root{
  /* 现有色板（styles/limbusCompany_FVTT.css §1） */
  --bg-darkest:#0B0707; --bg-mid:#1A1210;
  --text-main:#E8CAA2; --text-sub:#9B6839; --text-dim:#6E5540;
  --gold-active:#E5BA25; --border-gold:#5F3E22; --red-danger:#E94745;
  --font-main:"Noto Sans SC","Microsoft YaHei",sans-serif;

  /* ── 可调项 ── */
  --header-h:270px; --header-pad-y:8px; --header-pad-x:10px; --header-gap:6px;
  --col-left:260px; --col-mid:240px; --col-gap:4px;
  --col-bg:0;            /* 列底板浓度（%×10，0=无底板） */
  --col-border:0;        /* 列描边浓度 */

  --avatar:100px;
  --lv-font:32px; --xp-w:150px; --xp-bar-h:16px;
  --res-icon:32px; --res-w:200px; --res-h:24px; --res-gap:4px; --res-mt:6px;

  --ilabel-h:24px; --ilabel-mb:4px; --ilabel-font:12.8px;
  --irow-w:220px; --irow-h:50px; --info-icon:32px; --info-font:26px;
  --info-align:0;        /* 0=space-around（现状）  1=等宽网格对齐 */

  --bgtag-w:200px; --bgtag-h:25px;
  --name-font:32px;
  --attr-w:50px; --attr-h:70px; --attr-gap:6px;
  --attr-label:16px; --attr-value:16px; --attr-label-dim:0;  /* 1=名字降为次要色 */

  --tab-h:36px; --tab-font:12.8px; --tab-bar:0px;   /* 选中条粗细，0=只变色（现状） */
  --panel-w:275px; --panel-pad:8px;
  --plabel-h:55px; --plabel-font:24px; --plabel-mb:4px;
  --slot:70px; --slot-gap:12px;
  --foot-h:36px; --foot-pad:24px;
}
body{margin:0;padding:16px;background:#070605;color:var(--text-main);
  font-family:var(--font-main);display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;}
h1{font-size:15px;margin:0 0 8px;letter-spacing:.06em;}

/* ── 卡片 ─────────────────────────────────────────────── */
.sheet{width:880px;height:760px;display:flex;flex-direction:column;overflow:hidden;
  background:linear-gradient(180deg,var(--bg-darkest) 0%,var(--bg-mid) 50%,var(--bg-darkest) 100%);
  border:1px solid var(--border-gold);}

.head{display:flex;gap:var(--header-gap);padding:var(--header-pad-y) var(--header-pad-x) 6px;
  min-height:var(--header-h);flex-shrink:0;}
.col{display:flex;flex-direction:column;gap:var(--col-gap);
  background:rgba(255,255,255,calc(var(--col-bg) / 1000));
  border:1px solid rgba(95,62,33,calc(var(--col-border) / 100));
  border-radius:4px;padding:calc(var(--col-bg) * 0 + 0px);}
.col.pad{padding:6px 8px;}
.col-l{width:var(--col-left);flex-shrink:0;}
.col-m{width:var(--col-mid);flex-shrink:0;}
.col-r{flex:1;min-width:320px;}

.avatar-block{display:flex;flex-direction:row;align-items:flex-end;
  width:var(--col-left);height:var(--avatar);gap:8px;}
.avatar{width:var(--avatar);height:var(--avatar);flex-shrink:0;border-radius:4px;
  border:1px solid var(--border-gold);background:#2a1f18;}
.xp-section{width:var(--xp-w);flex-shrink:0;display:flex;flex-direction:column;
  justify-content:flex-end;gap:2px;}
.lv-row{display:flex;align-items:baseline;gap:3px;}
.lv-label{font-size:16px;font-weight:bold;color:#946438;}
.lv-value{font-size:var(--lv-font);font-weight:bold;color:#E8C9A2;line-height:1;}
.xp-values{display:flex;justify-content:flex-end;font-size:16px;gap:1px;}
.xp-cur{color:#E8C9A2;} .xp-max{color:#946438;}
.xp-bar{width:var(--xp-w);height:var(--xp-bar-h);background:#413C37;border-radius:2px;overflow:hidden;}
.xp-bar i{display:block;width:62%;height:100%;background:#B43822;}

.res-row{display:flex;align-items:center;gap:var(--res-gap);margin-top:var(--res-mt);}
.res-icon{width:var(--res-icon);height:var(--res-icon);background:#3a2a1c;border-radius:3px;flex-shrink:0;}
.res-bar{width:var(--res-w);height:var(--res-h);position:relative;border-radius:3px;overflow:hidden;
  background:rgba(95,62,33,.4);flex-shrink:0;}
.res-bar i{position:absolute;inset:0;width:60%;border-radius:3px;}
.res-bar.hp i{background:linear-gradient(90deg,#C62828,#E53935);}
.res-bar.san i{background:linear-gradient(90deg,#1565C0,#64B5F6);width:52%;}
.res-bar b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:.85rem;color:var(--text-main);text-shadow:0 1px 3px rgba(0,0,0,.8);font-weight:normal;}
.res-reset{width:20px;height:20px;background:#E8C9A2;border:1px solid #9A6839;border-radius:3px;flex-shrink:0;}

.iblock{margin-bottom:6px;}
.ilabel{height:var(--ilabel-h);line-height:var(--ilabel-h);background:#3B2412;color:#E1AC62;
  font-size:var(--ilabel-font);font-weight:bold;text-align:center;border-radius:2px;
  margin-bottom:var(--ilabel-mb);letter-spacing:.05em;}
.irow{width:var(--irow-w);height:var(--irow-h);align-items:center;
  display:flex;gap:6px;justify-content:space-around;}
.irow.grid{display:grid;grid-template-columns:var(--info-icon) 1fr var(--info-icon) 1fr var(--info-icon) 1fr;
  gap:0 4px;justify-content:initial;}
.irow.grid .v{text-align:center;}
.irow .ic{width:var(--info-icon);height:var(--info-icon);background:#3a2a1c;border-radius:3px;flex-shrink:0;}
.irow .v{font-size:var(--info-font);color:#E8C9A2;line-height:1;}

.name-block{display:flex;flex-direction:column;gap:2px;align-items:flex-end;}
.bg-tag{width:var(--bgtag-w);height:var(--bgtag-h);line-height:var(--bgtag-h);background:#3B2412;
  color:#9A6839;font-size:16px;text-align:right;padding-right:6px;border-radius:2px;}
.name{min-height:58px;display:flex;align-items:center;justify-content:flex-end;width:100%;}
.name span{font-size:var(--name-font);font-weight:bold;color:#E8C9A2;line-height:1.15;padding-right:6px;}
.attrs{display:flex;gap:var(--attr-gap);width:100%;max-width:360px;height:80px;
  align-items:center;justify-content:center;margin-left:auto;}
.attr{width:var(--attr-w);height:var(--attr-h);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;background:#5F3E22;border-radius:3px;flex-shrink:0;}
.attr .l{font-size:var(--attr-label);line-height:1;font-weight:bold;
  color:#E8C9A2;}
.attr.dim .l{font-weight:normal;color:#C0A183;}
.attr .v{font-size:var(--attr-value);font-weight:bold;color:var(--text-main);line-height:1;}
.attr .btn{width:16px;height:16px;border-radius:50%;background:#9A6839;}

/* Tab */
.tabs{display:flex;height:var(--tab-h);background:var(--bg-darkest);flex-shrink:0;}
.tabs a{flex:1;position:relative;display:flex;align-items:center;justify-content:center;
  font-size:var(--tab-font);color:var(--text-sub);cursor:pointer;}
.tabs a::after{content:"";position:absolute;left:12%;right:12%;bottom:0;height:var(--tab-bar);
  background:transparent;border-radius:1px;}
.tabs a.on{color:var(--gold-active);}
.tabs a.on::after{background:var(--gold-active);}

/* 工作区 */
.body{flex:1;display:flex;min-height:0;overflow:hidden;}
.side{width:var(--panel-w);flex-shrink:0;padding:var(--panel-pad);
  border-right:1px solid rgba(95,62,33,.4);display:flex;flex-direction:column;}
.plabel{width:100%;height:var(--plabel-h);line-height:var(--plabel-h);font-size:var(--plabel-font);
  color:#E8CAA1;text-align:center;margin-bottom:var(--plabel-mb);}
.grid{display:grid;grid-template-columns:repeat(3,var(--slot));gap:var(--slot-gap);justify-content:center;}
.slot{width:var(--slot);height:var(--slot);border:1px solid var(--border-gold);border-radius:4px;
  background:#5F3E22;box-shadow:inset 0 1px 3px rgba(0,0,0,.5);}
.slot.filled{background:#3B2412;}
.list{flex:1;min-width:0;padding:0 6px 6px 8px;}
.toolbar{display:flex;align-items:center;gap:4px;margin-bottom:4px;padding-top:4px;}
.toolbar input{flex:1;height:22px;background:#15110E;border:1px solid #3A2A1C;border-radius:3px;
  color:var(--text-main);font:12px var(--font-main);padding:2px 6px;}
.tb{width:22px;height:22px;border:1px solid #3A2A1C;border-radius:3px;background:#15110E;
  color:var(--text-sub);display:flex;align-items:center;justify-content:center;font-size:11px;}
.grp{height:22px;display:flex;align-items:center;padding:0 6px;font-size:12px;color:#C58C4E;
  background:#241A12;border-bottom:1px solid rgba(95,62,33,.4);}
.row{height:25px;display:flex;align-items:center;gap:8px;padding:0 6px;font-size:12px;
  border-bottom:1px solid rgba(95,62,33,.2);}
.row .ic{width:20px;height:20px;background:#2a1f18;border-radius:2px;}
.row.eq{background:rgba(95,62,33,.35);}

/* 底栏 */
.foot{height:var(--foot-h);display:flex;justify-content:space-between;align-items:center;
  padding:0 var(--foot-pad);background:#0A0605;border-top:1px solid var(--border-gold);flex-shrink:0;}
.foot > div{display:flex;align-items:center;gap:5px;font-size:.85rem;font-weight:bold;}
.foot .ic{width:18px;height:18px;background:#3a2a1c;border-radius:2px;}

/* ══ 面板 ══ */
.cfg{width:420px;border:1px solid #2b2119;border-radius:4px;padding:12px 14px;
  display:flex;flex-direction:column;gap:6px;max-height:760px;overflow:auto;}
.cfg h2{font-size:12px;color:var(--gold-active);margin:10px 0 2px;font-weight:normal;letter-spacing:.1em;}
.cfg h2:first-child{margin-top:0;}
.r{display:flex;align-items:center;gap:8px;font-size:11.5px;}
.r label{width:118px;color:var(--text-sub);}
.r input[type=range]{flex:1;min-width:80px;}
.r b{width:52px;text-align:right;color:var(--gold-active);}
textarea{width:100%;height:150px;background:#15110E;border:1px solid #3A2A1C;
  color:var(--text-main);font:11px/1.5 monospace;padding:7px;resize:vertical;margin-top:8px;}
.hint{font-size:11px;color:var(--text-dim);line-height:1.65;margin-top:6px;}
</style>

<div>
  <h1>角色卡·现版调参（保持简约棕金）</h1>
  <div class="sheet">
    <div class="head">
      <div class="col col-l" id="col-l">
        <div class="avatar-block">
          <div class="avatar"></div>
          <div class="xp-section">
            <div class="lv-row"><span class="lv-label">LV</span><span class="lv-value">10</span></div>
            <div class="xp-values"><span class="xp-cur">100</span><span>/</span><span class="xp-max">168</span></div>
            <div class="xp-bar"><i></i></div>
          </div>
        </div>
        <div class="res-row"><span class="res-icon"></span>
          <span class="res-bar hp"><i></i><b>99 / 99</b></span><span class="res-reset"></span></div>
        <div class="res-row"><span class="res-icon"></span>
          <span class="res-bar san"><i></i><b>50 / 95</b></span><span class="res-reset"></span></div>
      </div>

      <div class="col col-m" id="col-m">
        <div class="iblock"><div class="ilabel">基础信息</div>
          <div class="irow" id="irow1"><span class="ic"></span><span class="v">3</span>
            <span class="ic"></span><span class="v">2</span>
            <span class="ic"></span><span class="v">4-9</span></div></div>
        <div class="iblock"><div class="ilabel">抗性信息</div>
          <div class="irow" id="irow2"><span class="ic"></span><span class="v">1.0</span>
            <span class="ic"></span><span class="v">0.5</span>
            <span class="ic"></span><span class="v">2.0</span></div></div>
      </div>

      <div class="col col-r" id="col-r">
        <div class="name-block">
          <div class="bg-tag">定事务所 · 收尾人</div>
          <div class="name"><span>哈肯萨</span></div>
        </div>
        <div class="attrs" id="attrs">
          <div class="attr"><span class="l">力</span><span class="v">6</span><span class="btn"></span></div>
          <div class="attr"><span class="l">敏</span><span class="v">7</span><span class="btn"></span></div>
          <div class="attr"><span class="l">体</span><span class="v">5</span><span class="btn"></span></div>
          <div class="attr"><span class="l">智</span><span class="v">8</span><span class="btn"></span></div>
          <div class="attr"><span class="l">感</span><span class="v">4</span><span class="btn"></span></div>
          <div class="attr"><span class="l">魅</span><span class="v">3</span><span class="btn"></span></div>
        </div>
      </div>
    </div>

    <nav class="tabs"><a class="on">物品</a><a>技能</a><a>战斗</a></nav>

    <div class="body">
      <div class="side">
        <div class="plabel">装备栏</div>
        <div class="grid">
          <div class="slot filled"></div><div class="slot filled"></div><div class="slot"></div>
          <div class="slot filled"></div><div class="slot"></div><div class="slot"></div>
          <div class="slot"></div><div class="slot"></div><div class="slot"></div>
        </div>
      </div>
      <div class="list">
        <div class="toolbar"><input placeholder="搜索物品…">
          <span class="tb">★</span><span class="tb">▼</span><span class="tb">▤</span><span class="tb">＋</span></div>
        <div class="grp">▼ 武器（3）</div>
        <div class="row eq"><span class="ic"></span>庄严哀悼·生</div>
        <div class="row"><span class="ic"></span>旅人短刀</div>
        <div class="row"><span class="ic"></span>定制军刀</div>
        <div class="grp">▼ 消耗品（2）</div>
        <div class="row"><span class="ic"></span>止血绷带 ×3</div>
        <div class="row"><span class="ic"></span>镇静剂 ×1</div>
      </div>
    </div>

    <div class="foot">
      <div><span class="ic"></span>4949</div>
      <div><span class="ic"></span>18 / 40　<span class="ic"></span>7 / 11</div>
    </div>
  </div>
</div>

<div class="cfg" id="cfg"></div>

<script>
// [变量, 中文, min, max, step, 默认]；后缀 px。开关型用 0/1。
const GROUPS = [
  ["头部结构", [
    ["--header-h",     "头部最小高",   180, 360, 1, 270],
    ["--header-pad-y", "头部上下留白",   0,  30, 1, 8],
    ["--header-pad-x", "头部左右留白",   0,  30, 1, 10],
    ["--header-gap",   "三列间距",       0,  30, 1, 6],
    ["--col-left",     "左列宽",       180, 340, 1, 260],
    ["--col-mid",      "中列宽",       160, 320, 1, 240],
    ["--col-gap",      "列内行距",       0,  20, 1, 4],
    ["--col-bg",       "列底板浓度",     0,  60, 1, 0],
    ["--col-border",   "列描边浓度",     0,  60, 1, 0],
  ]],
  ["左列：头像 / 等级 / 资源条", [
    ["--avatar",   "头像尺寸",     70, 140, 1, 100],
    ["--lv-font",  "等级字号",     20,  46, 1, 32],
    ["--xp-w",     "经验条宽",    100, 220, 1, 150],
    ["--xp-bar-h", "经验条高",      6,  26, 1, 16],
    ["--res-icon", "资源图标",     20,  44, 1, 32],
    ["--res-w",    "资源条宽",    140, 280, 1, 200],
    ["--res-h",    "资源条高",     16,  40, 1, 24],
    ["--res-gap",  "图标条间距",    0,  16, 1, 4],
    ["--res-mt",   "资源行间距",    0,  20, 1, 6],
  ]],
  ["中列：信息块", [
    ["--ilabel-h",    "标题条高",     16, 40, 1, 24],
    ["--ilabel-font", "标题字号",     10, 20, .1, 12.8],
    ["--ilabel-mb",   "标题下间距",    0, 20, 1, 4],
    ["--irow-w",      "信息行宽",    160, 300, 1, 220],
    ["--irow-h",      "信息行高",     30, 80, 1, 50],
    ["--info-icon",   "信息图标",     20, 44, 1, 32],
    ["--info-font",   "信息数值字号", 12, 40, 1, 26],
    ["--info-align",  "①等宽网格对齐", 0,  1, 1, 0],
  ]],
  ["右列：名字 / 属性", [
    ["--bgtag-w",       "背景条宽",     140, 300, 1, 200],
    ["--bgtag-h",       "背景条高",      16,  40, 1, 25],
    ["--name-font",     "名字字号",      20,  46, 1, 32],
    ["--attr-w",        "属性格宽",      36,  80, 1, 50],
    ["--attr-h",        "属性格高",      44, 100, 1, 70],
    ["--attr-gap",      "属性格间距",     0,  20, 1, 6],
    ["--attr-label",    "属性名字号",     9,  24, 1, 16],
    ["--attr-value",    "属性值字号",    10,  32, 1, 16],
    ["--attr-label-dim","②名字降为次要",  0,   1, 1, 0],
  ]],
  ["导航 / 左栏 / 底栏", [
    ["--tab-h",       "Tab 高",        24, 56, 1, 36],
    ["--tab-font",    "Tab 字号",      10, 20, .1, 12.8],
    ["--tab-bar",     "③选中条粗细",    0,  5, 1, 0],
    ["--panel-w",     "左栏宽",       180, 380, 1, 275],
    ["--panel-pad",   "左栏内边距",     0,  24, 1, 8],
    ["--plabel-h",    "左栏标题高",    20,  80, 1, 55],
    ["--plabel-font", "左栏标题字号",  12,  34, 1, 24],
    ["--plabel-mb",   "标题下间距",     0,  24, 1, 4],
    ["--slot",        "装备格边长",    40, 100, 1, 70],
    ["--slot-gap",    "装备格间距",     0,  28, 1, 12],
    ["--foot-h",      "底栏高",        24,  60, 1, 36],
    ["--foot-pad",    "底栏左右留白",   0,  40, 1, 24],
  ]],
];

const $ = id => document.getElementById(id);
const all = GROUPS.flatMap(([, l]) => l);
const idOf = v => "p" + v.replace(/-/g, "_");
const SWITCH = new Set(["--info-align", "--attr-label-dim", "--col-bg", "--col-border", "--tab-bar"]);

$("cfg").innerHTML = GROUPS.map(([t, list]) => `<h2>${t}</h2>` + list.map(
  ([v, label, min, max, step, def]) =>
    `<div class="r"><label>${label}</label>
       <input type="range" id="${idOf(v)}" min="${min}" max="${max}" step="${step}" value="${def}">
       <b id="${idOf(v)}n"></b></div>`).join("")).join("")
  + `<textarea id="out" readonly></textarea>`
  + `<div class="hint">带 ①②③ 的三项是从改良版里吸取的做法（信息行等宽对齐 /
     属性名降级 / Tab 选中条），可以单独开关看效果。<br>
     导出的 CSS 贴到 <code>styles/limbusCompany_FVTT.css</code> 末尾即可，同名规则后写的生效。</div>`;

function apply() {
  const rs = document.documentElement.style;
  for (const [v] of all) {
    const raw = Number($(idOf(v)).value);
    rs.setProperty(v, SWITCH.has(v) ? raw : raw + "px");
    $(idOf(v) + "n").textContent = SWITCH.has(v) ? raw : raw + "px";
  }
  // 开关型：换 class
  const gridAlign = Number($(idOf("--info-align")).value) === 1;
  $("irow1").classList.toggle("grid", gridAlign);
  $("irow2").classList.toggle("grid", gridAlign);
  const dim = Number($(idOf("--attr-label-dim")).value) === 1;
  [...$("attrs").children].forEach(a => a.classList.toggle("dim", dim));
  dump();
}

function dump() {
  const n = v => Number($(idOf(v)).value);
  const p = v => n(v) + "px";
  const S = ".limbuscompany";
  const colBg = n("--col-bg"), colBd = n("--col-border");
  const lines = [
`/* ── 调参台导出：贴到 limbusCompany_FVTT.css 末尾 ── */
${S} .sheet-header { gap: ${p("--header-gap")}; padding: ${p("--header-pad-y")} ${p("--header-pad-x")} 6px; min-height: ${p("--header-h")}; }
${S} .header-col { gap: ${p("--col-gap")}; }
${S} .header-left { width: ${p("--col-left")}; }
${S} .header-mid  { width: ${p("--col-mid")}; }
${S} .avatar-block { width: ${p("--col-left")}; height: ${p("--avatar")}; }
${S} .actor-avatar, ${S} .avatar-img-wrap { width: ${p("--avatar")}; height: ${p("--avatar")}; }
${S} .lv-value { font-size: ${p("--lv-font")}; }
${S} .xp-section, ${S} .xp-bar-wrap { width: ${p("--xp-w")}; }
${S} .xp-bar-wrap { height: ${p("--xp-bar-h")}; }
${S} .resource-icon { width: ${p("--res-icon")}; height: ${p("--res-icon")}; }
${S} .resource-bar-wrap { width: ${p("--res-w")}; height: ${p("--res-h")}; }
${S} .resource-row { gap: ${p("--res-gap")}; margin-top: ${p("--res-mt")}; }
${S} .info-block-label { height: ${p("--ilabel-h")}; line-height: ${p("--ilabel-h")}; font-size: ${n("--ilabel-font")}px; margin-bottom: ${p("--ilabel-mb")}; }
${S} .info-row { width: ${p("--irow-w")}; height: ${p("--irow-h")}; }
${S} .info-icon, ${S} .resist-icon { width: ${p("--info-icon")}; height: ${p("--info-icon")}; }
${S} .info-val, ${S} .info-sign, ${S} .resist-val { font-size: ${p("--info-font")}; }
${S} .bg-tag, ${S} .bg-tag-input, ${S} .bg-add-btn { width: ${p("--bgtag-w")}; height: ${p("--bgtag-h")}; line-height: ${p("--bgtag-h")}; }
${S} .actor-name-display, ${S} .actor-name-input { font-size: ${p("--name-font")}; }
${S} .attributes-block { gap: ${p("--attr-gap")}; }
${S} .attr-item { width: ${p("--attr-w")}; height: ${p("--attr-h")}; }
${S} .attr-label { font-size: ${p("--attr-label")};${
  Number($(idOf("--attr-label-dim")).value) === 1 ? " font-weight: normal; color: #C0A183;" : ""} }
${S} .attr-value { font-size: ${p("--attr-value")}; }
${S} .sheet-tabs { height: ${p("--tab-h")}; }
${S} .sheet-tabs .item { height: ${p("--tab-h")}; font-size: ${n("--tab-font")}px; }
${S} .equip-panel { width: ${p("--panel-w")}; padding: ${p("--panel-pad")}; }
${S} .equip-panel-label { height: ${p("--plabel-h")}; line-height: ${p("--plabel-h")}; font-size: ${p("--plabel-font")}; margin-bottom: ${p("--plabel-mb")}; }
${S} .equip-grid { grid-template-columns: repeat(3, ${p("--slot")}); gap: ${p("--slot-gap")}; }
${S} .equip-slot { width: ${p("--slot")}; height: ${p("--slot")}; }
${S} .sheet-footer { height: ${p("--foot-h")}; padding: 0 ${p("--foot-pad")}; }`];

  if (colBg || colBd) lines.push(
`/* ① 三列托底 */
${S} .header-left, ${S} .header-mid, ${S} .header-right {
  background: rgba(255,255,255,${(colBg / 1000).toFixed(3)});
  border: 1px solid rgba(95,62,33,${(colBd / 100).toFixed(2)});
  border-radius: 4px; padding: 6px 8px; box-sizing: border-box;
}`);

  if (Number($(idOf("--info-align")).value) === 1) lines.push(
`/* ② 信息行等宽网格：两行的图标与数字上下对齐 */
${S} .info-row {
  display: grid;
  grid-template-columns: ${p("--info-icon")} 1fr ${p("--info-icon")} 1fr ${p("--info-icon")} 1fr;
  gap: 0 4px; align-items: center; justify-content: initial;
}
${S} .info-row > span { text-align: center; }`);

  if (n("--tab-bar") > 0) lines.push(
`/* ③ Tab 选中条 */
${S} .sheet-tabs .item { position: relative; }
${S} .sheet-tabs .item::after {
  content: ""; position: absolute; left: 12%; right: 12%; bottom: 0;
  height: ${p("--tab-bar")}; border-radius: 1px; background: transparent; transition: background .15s;
}
${S} .sheet-tabs .item.active::after { background: var(--gold-active); }
${S} .sheet-tabs .item:hover::after { background: rgba(229,186,37,.35); }`);

  $("out").value = lines.join("\n\n");
}

for (const [v] of all) $(idOf(v)).addEventListener("input", apply);
document.querySelectorAll(".tabs a").forEach(a => a.addEventListener("click", () => {
  document.querySelectorAll(".tabs a").forEach(x => x.classList.remove("on"));
  a.classList.add("on");
}));
apply();
</script>
