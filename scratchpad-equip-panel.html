<!doctype html>
<meta charset="utf-8">
<title>物品页左栏·间距调参</title>
<style>
:root{
  --bg-darkest:#0B0707; --bg-mid:#1A1210; --text-main:#E8CAA2; --text-sub:#9B6839;
  --text-dim:#6E5540; --gold-active:#E5BA25; --border-gold:#5F3E22;
  --font-main:"Noto Sans SC","Microsoft YaHei",sans-serif;

  /* ── 可调参数（面板实时改，导出即 CSS） ── */
  --panel-w:275px;      /* 左栏宽度 */
  --panel-pad:8px;      /* 左栏内边距 */
  --label-h:55px;       /* 标题条高度 */
  --label-size:24px;    /* 标题字号 */
  --label-mb:4px;       /* 标题到内容的间距 */
  --slot:70px;          /* 九宫格格子边长 */
  --grid-gap:12px;      /* 九宫格间距 */
  --stage-ratio:1.333;  /* 形象舞台高宽比 */
  --foot-mt:6px;        /* 内容到底部按钮条的间距 */
  --foot-gap:6px;       /* 底部两个按钮之间的间距 */
  --hint-mt:4px;        /* 提示条上间距 */
}
body{margin:0;padding:16px;background:#0B0707;color:var(--text-main);
  font-family:var(--font-main);display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;}
h1{font-size:16px;margin:0 0 3px;letter-spacing:.06em;}
p.sub{margin:0 0 12px;font-size:12px;color:var(--text-dim);max-width:560px;}

/* ══ 左栏本体：与 tab-items.hbs / §3-E 同结构 ══════════════════════ */
.sheet-mock{display:flex;background:linear-gradient(180deg,#0B0707,#1A1210 50%,#0B0707);
  border:1px solid #2b2119;border-radius:4px;height:640px;overflow:hidden;}
.equip-panel{
  width:var(--panel-w);flex-shrink:0;padding:var(--panel-pad);
  border-right:1px solid rgba(95,62,33,.4);
  display:flex;flex-direction:column;
}
.equip-panel-label{
  width:100%;height:var(--label-h);line-height:var(--label-h);
  font-size:var(--label-size);color:#E8CAA1;text-align:center;
  margin-bottom:var(--label-mb);user-select:none;flex-shrink:0;
}
.equip-grid{display:grid;grid-template-columns:repeat(3,var(--slot));
  gap:var(--grid-gap);justify-content:center;}
.equip-slot{
  width:var(--slot);height:var(--slot);
  border:1px solid var(--border-gold);border-radius:4px;background:#5F3E22;
  display:flex;align-items:center;justify-content:center;position:relative;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.5);
}
.equip-slot.filled{background:#3B2412;}
.equip-slot .ph{width:40%;height:40%;border:1px dashed rgba(95,62,33,.35);border-radius:2px;}

.doll-stage{
  position:relative;width:100%;height:calc((var(--panel-w) - var(--panel-pad)*2) * var(--stage-ratio));
  overflow:hidden;background:#0e0b09;border:1px solid var(--border-gold);border-radius:3px;
}
.doll-stage .mark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font-size:12px;color:var(--text-dim);}
.doll-hint{margin-top:var(--hint-mt);font-size:11px;color:var(--text-dim);
  line-height:1.6;text-align:center;}
.doll-hint b{color:var(--gold-active);}

.equip-panel-foot{display:flex;gap:var(--foot-gap);justify-content:center;margin-top:var(--foot-mt);}
.toolbar-btn{padding:2px 10px;font-size:12px;cursor:pointer;
  border:1px solid #3A2A1C;border-radius:3px;background:#15110E;color:var(--text-sub);}
.toolbar-btn.active{background:var(--gold-active);border-color:var(--gold-active);
  color:#15110E;font-weight:bold;}

/* 右侧占位（物品列表），只为看左右分栏的比例 */
.list-mock{flex:1;padding:0 6px 6px 8px;font-size:12px;color:var(--text-dim);}
.list-mock .bar{height:22px;margin:4px 0;background:#15110E;border:1px solid #2b2119;border-radius:3px;}

/* ══ 调参面板 ══════════════════════════════════════════════════ */
.panel{border:1px solid #2b2119;border-radius:4px;padding:12px 14px;width:420px;
  display:flex;flex-direction:column;gap:7px;}
.row{display:flex;align-items:center;gap:8px;font-size:12px;}
.row label{width:120px;color:var(--text-sub);}
.row input[type=range]{flex:1;min-width:110px;}
.row b{width:56px;text-align:right;color:var(--gold-active);}
.seg{display:flex;gap:5px;margin-bottom:2px;}
.seg span{font-size:11.5px;padding:3px 10px;border-radius:999px;cursor:pointer;
  border:1px solid #3A2A1C;background:#15110E;color:var(--text-sub);}
.seg span.on{background:var(--gold-active);border-color:var(--gold-active);
  color:#15110E;font-weight:bold;}
textarea{width:100%;height:170px;background:#15110E;border:1px solid #3A2A1C;border-radius:3px;
  color:var(--text-main);font:11.5px/1.55 monospace;padding:7px;resize:vertical;}
.note{font-size:11.5px;color:var(--text-dim);line-height:1.7;}
</style>

<div>
  <h1>物品页左栏·间距调参</h1>
  <p class="sub">九宫格装备栏与形象视图共用同一块左栏。调好后把下面的 CSS 覆盖
    <code>styles/limbusCompany_FVTT.css</code> 对应几条规则。</p>
  <div class="sheet-mock">
    <div class="equip-panel">
      <div class="equip-panel-label" id="panel-title">装备栏</div>
      <div id="view-grid">
        <div class="equip-grid" id="grid"></div>
      </div>
      <div id="view-doll" style="display:none">
        <div class="doll-stage"><span class="mark">形象舞台（3:4 区域）</span></div>
        <div class="doll-hint">当前：<b>移动</b>　·　拖动＝生效　·　<b>R</b> 旋转　<b>E</b> 缩放<br>
          滚轮＝调整该装备的图层前后（头永远最前）</div>
      </div>
      <div class="equip-panel-foot">
        <span class="toolbar-btn" id="btn-view">形象</span>
        <span class="toolbar-btn active" id="btn-edit" style="display:none">编辑形象</span>
      </div>
    </div>
    <div class="list-mock">
      物品列表（占位）
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    </div>
  </div>
</div>

<div class="panel">
  <div class="seg" id="seg">
    <span class="on" data-v="grid">九宫格视图</span>
    <span data-v="doll">形象视图</span>
  </div>

  <div class="row"><label>左栏宽度</label><input type="range" id="panel-w" min="180" max="420" step="1"><b id="panel-w-n"></b></div>
  <div class="row"><label>左栏内边距</label><input type="range" id="panel-pad" min="0" max="24" step="1"><b id="panel-pad-n"></b></div>
  <div class="row"><label>标题条高度</label><input type="range" id="label-h" min="20" max="90" step="1"><b id="label-h-n"></b></div>
  <div class="row"><label>标题字号</label><input type="range" id="label-size" min="12" max="36" step="1"><b id="label-size-n"></b></div>
  <div class="row"><label>标题下间距</label><input type="range" id="label-mb" min="0" max="30" step="1"><b id="label-mb-n"></b></div>
  <div class="row"><label>格子边长</label><input type="range" id="slot" min="40" max="100" step="1"><b id="slot-n"></b></div>
  <div class="row"><label>格子间距</label><input type="range" id="grid-gap" min="0" max="30" step="1"><b id="grid-gap-n"></b></div>
  <div class="row"><label>舞台高宽比</label><input type="range" id="stage-ratio" min="80" max="200" step="1"><b id="stage-ratio-n"></b></div>
  <div class="row"><label>提示条上间距</label><input type="range" id="hint-mt" min="0" max="24" step="1"><b id="hint-mt-n"></b></div>
  <div class="row"><label>按钮条上间距</label><input type="range" id="foot-mt" min="0" max="30" step="1"><b id="foot-mt-n"></b></div>
  <div class="row"><label>按钮间距</label><input type="range" id="foot-gap" min="0" max="24" step="1"><b id="foot-gap-n"></b></div>

  <textarea id="out" readonly></textarea>
  <div class="note">
    左栏宽度会连带改变形象舞台的高度（舞台按左栏内容宽 × 高宽比算），
    所以先定宽度再调舞台比例。
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

// 参数表：id → { css 变量名, 单位, 默认值, 显示转换 }
const P = [
  ["panel-w",     "--panel-w",     "px", 275],
  ["panel-pad",   "--panel-pad",   "px", 8],
  ["label-h",     "--label-h",     "px", 55],
  ["label-size",  "--label-size",  "px", 24],
  ["label-mb",    "--label-mb",    "px", 4],
  ["slot",        "--slot",        "px", 70],
  ["grid-gap",    "--grid-gap",    "px", 12],
  ["stage-ratio", "--stage-ratio", "",   133],   // 显示为 1.33，写入时 /100
  ["hint-mt",     "--hint-mt",     "px", 4],
  ["foot-mt",     "--foot-mt",     "px", 6],
  ["foot-gap",    "--foot-gap",    "px", 6],
];

// 九宫格占位
$("grid").innerHTML = Array.from({ length: 9 }, (_, i) =>
  `<div class="equip-slot${i < 4 ? " filled" : ""}"><div class="ph"></div></div>`).join("");

function apply() {
  const rs = document.documentElement.style;
  for (const [id, varName, unit] of P) {
    const raw = Number($(id).value);
    const val = varName === "--stage-ratio" ? (raw / 100) : raw;
    rs.setProperty(varName, val + unit);
    $(id + "-n").textContent = varName === "--stage-ratio"
      ? val.toFixed(2) : (val + unit);
  }
  dump();
}
function dump() {
  const g = id => Number($(id).value);
  $("out").value =
`.limbuscompany .equip-panel {
  width: ${g("panel-w")}px; flex-shrink: 0; padding: ${g("panel-pad")}px;
  border-right: 1px solid rgba(95,62,33,.4);
  display: flex; flex-direction: column;
}
.limbuscompany .equip-panel-label {
  width: 100%; height: ${g("label-h")}px; line-height: ${g("label-h")}px;
  font-size: ${g("label-size")}px; color: #E8CAA1; text-align: center;
  border: none; background: transparent;
  margin-bottom: ${g("label-mb")}px; user-select: none; flex-shrink: 0;
}
.limbuscompany .equip-grid {
  display: grid; grid-template-columns: repeat(3, ${g("slot")}px);
  gap: ${g("grid-gap")}px; justify-content: center;
}
.limbuscompany .equip-slot { width: ${g("slot")}px; height: ${g("slot")}px; }
.limbuscompany .doll-stage { aspect-ratio: 1 / ${(g("stage-ratio") / 100).toFixed(3)}; }
.limbuscompany .doll-hint { margin-top: ${g("hint-mt")}px; }
.limbuscompany .equip-panel-foot {
  display: flex; gap: ${g("foot-gap")}px; justify-content: center; margin-top: ${g("foot-mt")}px;
}`;
}

for (const [id, , , def] of P) {
  $(id).value = def;
  $(id).addEventListener("input", apply);
}

// 视图切换（只为预览两种状态下的间距）
$("seg").addEventListener("click", (ev) => {
  const v = ev.target?.dataset?.v;
  if (!v) return;
  [...$("seg").children].forEach(c => c.classList.toggle("on", c.dataset.v === v));
  const doll = v === "doll";
  $("view-grid").style.display = doll ? "none" : "";
  $("view-doll").style.display = doll ? "" : "none";
  $("panel-title").textContent = doll ? "形象" : "装备栏";
  $("btn-view").textContent = doll ? "装备栏" : "形象";
  $("btn-edit").style.display = doll ? "" : "none";
});

apply();
</script>
